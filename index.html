<!DOCTYPE html>
<!-- Atlas des civilisations — v2.8.0 -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="generator" content="Atlas des civilisations 2.8.0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas des civilisations · 5000 av. J.-C. → 1900</title>
<style>
:root{
  --paper:#e6e6e2; --sea:#dae1e6; --land:#e8e4da; --land-line:#b9b6ab;
  --surface:#f7f7f5; --surface-2:#efefec; --surface-3:#e4e4df;
  --ink:#181b1e; --ink-2:#454c53; --muted:#7c838a;
  --line:#d3d4d0; --line-2:#bcbdb8;
  --accent:#2c4a63; --accent-soft:#e2e9ef;
  --flag:#9d3d2d;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::selection{background:#cbd7e1}

/* ---------- ossature ---------- */
.app{
  display:grid; height:100dvh;
  grid-template-columns:minmax(0,1fr) var(--side-w,384px);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "map side" "time side";
}
.topbar{
  grid-area:top; display:flex; align-items:center; gap:14px;
  padding:0 14px; height:46px; background:var(--surface);
  border-bottom:1px solid var(--line-2);
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand h1{
  font-family:var(--serif); font-size:16px; font-weight:600; margin:0;
  letter-spacing:.01em; white-space:nowrap;
}
.brand .rng{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.spacer{flex:1}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

.search{position:relative;width:230px}
.search input{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:5px 9px 5px 26px;font-size:12.5px;
}
.search input::placeholder{color:var(--muted)}
.search .ic{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;line-height:0}
.results{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 8px 24px rgba(20,25,30,.14);
  max-height:340px;overflow:auto;z-index:60;display:none;padding:3px
}
.results.on{display:block}
.results b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:7px 8px 3px;font-weight:400}
.results button{display:flex;width:100%;gap:8px;align-items:baseline;padding:5px 8px;border-radius:2px;text-align:left}
.results button:hover,.results button.cur{background:var(--accent-soft)}
.results .yr{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap}

.btn{
  border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r);
  padding:4px 9px;font-size:12px;color:var(--ink-2);white-space:nowrap;
}
.btn:hover{background:var(--surface-3);color:var(--ink)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{background:#22405a;color:#fff}
.btn.danger{color:var(--flag);border-color:#dcc4bf}
.btn.danger:hover{background:#f6e9e6}
.btn.sm{padding:2px 6px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.save-state{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em;min-width:66px;text-align:right}

/* ---------- carte ---------- */
.mapwrap{grid-area:map;position:relative;background:var(--sea);border-right:1px solid var(--line-2);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.grabbing{cursor:grabbing}
#map.drawing{cursor:crosshair}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:.7px;vector-effect:non-scaling-stroke}
.lake{fill:var(--sea);stroke:#a7b5be;stroke-width:.6px;vector-effect:non-scaling-stroke}
.river{fill:none;stroke:#a2b6c1;stroke-width:.9px;vector-effect:non-scaling-stroke;stroke-linecap:round}
.mvt{cursor:pointer}
.mvt-label{font-family:var(--sans);font-style:italic;pointer-events:none;paint-order:stroke;stroke:rgba(247,247,245,.9);stroke-linejoin:round}
.evm{cursor:pointer}
.grid line{stroke:#c3ccd3;stroke-width:.6px;vector-effect:non-scaling-stroke}
.terr{cursor:pointer}
.terr path{stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill-opacity .12s}
.terr .hit{fill:transparent;stroke:none}
.terr-label{
  font-family:var(--serif);font-weight:600;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:rgba(247,247,245,.85);stroke-linejoin:round;letter-spacing:.06em;
}
.poi{cursor:pointer}
.poi-label{font-family:var(--sans);pointer-events:none;paint-order:stroke;stroke:rgba(247,247,245,.9);stroke-linejoin:round}
.vtx{fill:var(--surface);stroke:var(--accent);stroke-width:1.4px;vector-effect:non-scaling-stroke;cursor:move}
.vtx.mid{fill:var(--accent);stroke:none;opacity:.45;cursor:copy}
.draft{fill:rgba(44,74,99,.12);stroke:var(--accent);stroke-width:1.4px;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}

.overlay-tl{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:20}
.tool{
  display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);
  box-shadow:0 1px 3px rgba(20,25,30,.10);overflow:hidden;
}
.tool button{padding:5px 10px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--line)}
.tool button:last-child{border-right:none}
.tool button:hover{background:var(--surface-2)}
.tool button.on{background:var(--accent);color:#fff}
.hint{
  background:var(--surface);border:1px solid var(--line-2);border-left:2px solid var(--flag);
  border-radius:var(--r);padding:6px 10px;font-size:12px;max-width:330px;
  box-shadow:0 1px 3px rgba(20,25,30,.10);display:flex;gap:10px;align-items:center
}
.hint kbd{font-family:var(--mono);font-size:10px;background:var(--surface-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:2px;padding:0 3px}
.overlay-br{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:20}
.sw{width:11px;height:11px;flex:0 0 auto;border-radius:2px;border:1px solid rgba(0,0,0,.22)}
.tip{
  position:absolute;z-index:40;pointer-events:none;background:#22282d;color:#f2f2ef;
  padding:4px 8px;border-radius:var(--r);font-size:11.5px;max-width:250px;
  box-shadow:0 3px 10px rgba(0,0,0,.25);opacity:0;transition:opacity .1s
}
.tip.on{opacity:1}
.tip .yr{font-family:var(--mono);color:#a9b6c1;font-size:10.5px}
.scalebar{font-family:var(--mono);font-size:10px;color:var(--ink-2);background:rgba(247,247,245,.82);padding:2px 6px;border-radius:2px}

/* ---------- frise ---------- */
.timeline{
  grid-area:time;background:var(--surface);border-top:1px solid var(--line-2);
  display:flex;flex-direction:column;height:var(--tl-h,246px);position:relative;user-select:none
}
.tl-head{display:flex;align-items:center;gap:10px;padding:6px 12px 4px;border-bottom:1px solid var(--line)}
.readout{display:flex;align-items:baseline;gap:6px}
.readout .y{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.readout .e{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.tl-filter{display:flex;gap:0;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.tl-filter button{padding:3px 8px;font-size:11.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.tl-filter button:last-child{border:none}
.tl-filter button.on{background:var(--accent);color:#fff}

.tl-body{flex:1;position:relative;overflow:hidden;cursor:ew-resize;min-height:0}
.ruler{height:26px;position:relative;border-bottom:1px solid var(--line);background:var(--surface-2);flex:0 0 auto}
.ruler .tk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-2)}
.ruler .tk.minor{border-color:#e2e2de}
.ruler .tk span{position:absolute;left:4px;top:5px;font-family:var(--mono);font-size:10px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.events-band{height:46px;position:relative;border-bottom:1px solid var(--line);flex:0 0 auto;background:linear-gradient(var(--surface-2),var(--surface))}
.events-band .lbl{position:absolute;left:0;top:0;bottom:0;padding:6px 10px 0 12px;z-index:2;background:linear-gradient(90deg,var(--surface) 78%,transparent)}
.ev{position:absolute;top:6px;width:9px;height:15px;margin-left:-4px;cursor:pointer}
.ev.r1{top:26px}
.evs{position:absolute;top:6px;height:14px;min-width:3px;border:1px solid var(--flag);border-radius:2px;background:rgba(157,61,45,.16);cursor:pointer;overflow:hidden;white-space:nowrap;font-size:10px;line-height:12px;padding:0 3px;color:#6d281c}
.evs.r1{top:26px;background:rgba(157,61,45,.08)}
.evs:hover{background:rgba(157,61,45,.3)}
.evs.sel{box-shadow:0 0 0 1.5px var(--ink);background:rgba(157,61,45,.32);font-weight:600}
.ev i{display:block;width:1.5px;height:11px;margin:0 auto;background:var(--flag)}
.ev b{display:block;width:5px;height:5px;border-radius:50%;background:var(--flag);margin:0 auto;border:1px solid var(--surface)}
.ev:hover i,.ev:hover b,.ev.sel i,.ev.sel b{background:var(--ink)}
.lanes{position:absolute;inset:0;top:72px;overflow-y:auto;overflow-x:hidden}
.lane-in{position:relative;padding:6px 0 10px}
.bar{
  position:absolute;height:17px;border-radius:2px;display:flex;align-items:center;
  padding:0 5px;font-size:11px;white-space:nowrap;overflow:hidden;cursor:pointer;
  border:1px solid rgba(0,0,0,.18);color:#1b1f22;
}
.bar:hover{filter:brightness(.95)}
.bar.sel{box-shadow:0 0 0 1.5px var(--ink);z-index:2;font-weight:600}
.bar.off{opacity:.42}
.bar span{overflow:hidden;text-overflow:ellipsis}
.filiations{position:absolute;left:0;top:6px;overflow:visible;pointer-events:none;z-index:3}
.filiations g{pointer-events:auto;cursor:pointer}
.filiations path{fill:none;stroke:#8a9199;stroke-width:1.1;opacity:.5}
.filiations path.hit{stroke:transparent;stroke-width:9;opacity:1}
.filiations path.hd{fill:#8a9199;stroke:none;opacity:.5}
.filiations circle{fill:#8a9199;opacity:.5}
.filiations g:hover path,.filiations g.on path{stroke:var(--flag);opacity:1;stroke-width:1.7}
.filiations g:hover path.hit,.filiations g.on path.hit{stroke:transparent}
.filiations g:hover path.hd,.filiations g.on path.hd{fill:var(--flag);opacity:1}
.filiations g:hover circle,.filiations g.on circle{fill:var(--flag);opacity:1}
.subj{position:absolute;height:17px;box-sizing:border-box;z-index:2;cursor:pointer;border-radius:2px;
  background:repeating-linear-gradient(45deg,var(--c) 0 1.6px,transparent 1.6px 5px);
  border-left:2px solid var(--c);border-right:2px solid var(--c);opacity:.8}
.subj:hover{opacity:1}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--flag);z-index:6;pointer-events:none}
.playhead:after{content:"";position:absolute;top:0;left:-4px;border:4px solid transparent;border-top-color:var(--flag);border-bottom:none;height:0}
.tl-empty{padding:14px;color:var(--muted);font-size:12px}

/* ---------- panneau ---------- */
.side{grid-area:side;background:var(--surface);display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}
.tabs{display:flex;border-bottom:1px solid var(--line-2);flex:0 0 auto;background:var(--surface-2)}
.tabs button{
  flex:1;padding:8px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px
}
.tabs button.on{color:var(--ink);border-bottom-color:var(--flag);background:var(--surface)}
.panel{flex:1;overflow:auto;overscroll-behavior:contain}
.pad{padding:14px}
.empty{padding:26px 16px;color:var(--muted);font-size:12.5px;text-align:center}
.empty p{margin:0 0 4px}

.sheet-head{padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.sheet-head .kind{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.sheet-head h2{font-family:var(--serif);font-size:21px;line-height:1.15;margin:0 0 5px;font-weight:600}
.dates{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dates em{font-style:normal;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);margin-top:3px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.prose{font-size:13.5px;line-height:1.62;color:#22272b}
.prose p{margin:0 0 .75em}
.prose h4{font-family:var(--serif);font-size:14.5px;margin:1.1em 0 .35em}
.prose ul{margin:.2em 0 .8em;padding-left:17px}
.prose li{margin:.15em 0}
.prose a{color:var(--accent)}
.prose code{font-family:var(--mono);font-size:12px;background:var(--surface-3);padding:0 3px;border-radius:2px}
.prose blockquote{margin:.4em 0;padding-left:10px;border-left:2px solid var(--line-2);color:var(--ink-2)}

.sect{border-top:1px solid var(--line);padding:12px 14px}
.sect-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sect-h .eyebrow{flex:1}
.item{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;margin:0 -6px;border-radius:2px}
.item:hover{background:var(--surface-2)}
.item .main{flex:1;min-width:0;text-align:left}
.item .t{font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .acts{display:flex;gap:3px;opacity:0;flex:0 0 auto}
.item:hover .acts,.item:focus-within .acts{opacity:1}
.iconbtn{width:22px;height:20px;display:grid;place-items:center;border-radius:2px;color:var(--muted);border:1px solid transparent}
.iconbtn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--line-2)}
.iconbtn.danger:hover{color:var(--flag)}
.links a{display:block;font-size:12.5px;color:var(--accent);margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.2)}
.pill{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line-2);border-radius:2px;padding:1px 5px;color:var(--muted)
}
.pill.live{border-color:#cbb0a9;color:var(--flag)}
.stat{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;padding:3px 0;border-bottom:1px dotted var(--line)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}

/* ---------- formulaire / modale ---------- */
.scrim{position:fixed;inset:0;background:rgba(24,27,30,.34);z-index:100;display:grid;place-items:center;padding:16px}
.modal{
  background:var(--surface);border:1px solid var(--line-2);border-radius:4px;width:min(520px,100%);
  max-height:88dvh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(20,25,30,.3)
}
.modal header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h3{font-family:var(--serif);font-size:16px;margin:0;font-weight:600;flex:1}
.modal .body{padding:14px 16px;overflow:auto}
.modal footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2)}
.f{margin-bottom:11px}
.f>label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.f input[type=text],.f input[type=number],.f select,.f textarea{
  width:100%;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:6px 8px;font-size:13px
}
.f textarea{min-height:110px;resize:vertical;line-height:1.55}
.f .help{font-size:11.5px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.swatches button{width:20px;height:20px;border-radius:3px;border:1px solid rgba(0,0,0,.2)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.wiki{display:flex;gap:6px}
.wiki input{flex:1}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);z-index:200;
  background:#22282d;color:#f2f2ef;padding:8px 14px;border-radius:var(--r);font-size:12.5px;
  opacity:0;transition:.16s;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.28)
}
.toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:1000px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "map" "time" "side";height:auto;max-width:100vw}
  body{overflow-x:hidden}
  .topbar,.timeline,.side,.mapwrap{min-width:0}
  .tl-head>.spacer{display:none}
  .tl-head{justify-content:flex-start}
  .mapwrap{height:44dvh;border-right:none;border-bottom:1px solid var(--line-2)}
  .side{border-top:1px solid var(--line-2);max-height:none}
  .timeline{height:236px}
  .tl-head{flex-wrap:wrap;row-gap:5px}
  #tlCount,.save-state{display:none}
  .overlay-tl .tool button{padding:5px 7px;font-size:11.5px}
  .brand{overflow:hidden}
  .brand h1{font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
  .search{width:44px;flex:0 0 auto;transition:width .18s}
  .search:focus-within{width:190px}
  .brand .rng{display:none}
  .modal{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- v2.0.0 : fond détaillé, comptes, propositions ---------- */
[hidden]{display:none!important}
.dland{fill:var(--land);stroke:none}
.dcoast{fill:none;stroke:var(--land-line);stroke-width:.7px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.dlake{fill:var(--sea);stroke:none}
.dshore{fill:none;stroke:#a7b5be;stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
body.ro .ed,body.ro .item .acts{display:none!important}
.role-chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.role-chip.r-editor,.role-chip.r-admin{border-color:var(--accent);color:var(--accent)}
.role-chip.r-local{border-color:#cbb0a9;color:var(--flag)}
#btnAccount{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:25;background:#22282d;color:#f2f2ef;padding:6px 10px;border-radius:var(--r);font-size:12px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25);max-width:min(560px,62%)}
.banner .btn{background:#f2f2ef;color:#22282d;border-color:#f2f2ef}
body.previewing .mapwrap{box-shadow:inset 0 0 0 3px var(--flag)}
.modal.narrow{width:min(420px,100%)}
.modal.wide{width:min(700px,100%)}
.modal footer .spacer{flex:1}
.f input[type=email],.f input[type=password]{width:100%;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:6px 8px;font-size:13px}
.auth-msg{display:none;font-size:12px;padding:7px 9px;border-radius:var(--r);background:#f6e9e6;color:var(--flag);margin-top:6px}
.auth-msg.ok{background:var(--accent-soft);color:var(--accent)}
.auth-links{display:flex;gap:16px;margin-top:12px}
.linkbtn{color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.oplist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:4px 9px}

  body{overflow:hidden}
  .app{height:100dvh;max-width:100vw;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "map" "time"}

}

<script>


"use strict";
/* =====================================================================
   ATLAS DES CIVILISATIONS — v2.8.0
   Données : base partagée Supabase (lecture publique, écriture par rôle)
             ou, à défaut, data/atlas.json + brouillon local
   Fond de carte : data/geo (Natural Earth 1:50M + tuiles 1:10M, relief ombré)
   ===================================================================== */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const el = (t, a = {}, kids = []) => {
  const n = document.createElementNS(a.ns || "http://www.w3.org/1999/xhtml", t);
  for (const k in a) { if (k === "ns") continue; if (k === "class") n.setAttribute("class", a[k]); else if (k.startsWith("on")) n.addEventListener(k.slice(2), a[k]); else if (a[k] !== null && a[k] !== undefined) n.setAttribute(k, a[k]); }
  for (const c of [].concat(kids)) if (c !== null && c !== undefined) n.append(c);
  return n;
};
const svgEl = (t, a = {}) => { const n = document.createElementNS("http://www.w3.org/2000/svg", t); for (const k in a) if (a[k] !== null && a[k] !== undefined) n.setAttribute(k, a[k]); return n; };
const uid = p => p + "-" + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const Y0 = -5000, Y1 = 1900;

/* --- années --- */
function fmtYear(y, long) {
  y = Math.round(y);
  const a = Math.abs(y) || 1;
  if (y < 0) return a + (long ? " av. J.-C." : " av.");
  return a + (long ? " ap. J.-C." : "");
}
function fmtSpan(a, b) {
  const open = (b === null || b === undefined || b >= Y1);
  return fmtYear(a, true) + " → " + (open && b >= Y1 ? fmtYear(Y1, true) : fmtYear(b, true));
}
function parseYear(txt) {
  if (txt === "" || txt === null || txt === undefined) return null;
  const s = String(txt).trim().toLowerCase().replace(",", ".");
  const neg = /av|bc|b\.c|avant/.test(s);
  const n = parseFloat(s.replace(/[^\d.\-]/g, ""));
  if (isNaN(n)) return null;
  return neg ? -Math.abs(n) : n;
}

/* --- mini-markdown --- */
function md(src) {
  if (!src) return "";
  const blocks = String(src).replace(/\r/g, "").split(/\n{2,}/);
  const inline = t => esc(t)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\n/g, "<br>");
  return blocks.map(b => {
    b = b.trim(); if (!b) return "";
    if (/^#{1,4}\s/.test(b)) return "<h4>" + inline(b.replace(/^#{1,4}\s/, "")) + "</h4>";
    if (/^>\s/.test(b)) return "<blockquote>" + inline(b.replace(/^>\s?/gm, "")) + "</blockquote>";
    if (/^[-*]\s/m.test(b) && /^[-*]\s/.test(b))
      return "<ul>" + b.split("\n").map(l => "<li>" + inline(l.replace(/^[-*]\s*/, "")) + "</li>").join("") + "</ul>";
    return "<p>" + inline(b) + "</p>";
  }).join("");
}

/* =====================  PERSISTANCE & SYNCHRONISATION  ===================== */
/* Deux modes :
   - « base partagée » (Supabase configuré dans config.js) : les données publiées
     sont lues par tous ; les éditeurs publient directement, les contributeurs
     envoient des propositions soumises à validation ;
   - « fichier » (pas de configuration) : lecture de data/atlas.json, modifications
     conservées dans ce navigateur, export pour mise à jour du dépôt. */
const APP_VERSION = "2.8.0";
const COLLS = ["civs", "territories", "events", "pois", "links", "subjections", "persons", "dynasties"];
const COLL_LABEL = { dynasties: "Dynastie", persons: "Personnage", civs: "Civilisation", territories: "Territoire", events: "Événement", pois: "Lieu", links: "Filiation", subjections: "Tutelle" };
const ROLE_LABEL = { viewer: "Visiteur", contributor: "Contributeur", editor: "Éditeur", admin: "Administrateur", local: "Local" };
const DRAFT_KEY = "atlas-civ:draft:v2";
const CFG = window.ATLAS_CONFIG || {};
let SB = null;                 // client Supabase (null en mode fichier)
let backend = "file";          // "supabase" | "file"
let remoteState = "ok";        // ok | empty (base vide) | down (injoignable)
let user = null, profile = null, role = "viewer";
let base = emptyBase();        // état publié connu : { coll: Map(id -> JSON canonique) }
let draftOrig = new Map();     // version d'origine des éléments d'un brouillon, pour la relecture
let syncTimer = null, syncing = false, pendingOps = 0, lastRefresh = 0;
let preview = null;            // aperçu d'une proposition : { p, saved, savedSel }
let pendingReview = 0;         // propositions en attente (éditeurs)

const emptyDb = () => ({ civs: [], territories: [], events: [], pois: [], links: [], subjections: [], persons: [], dynasties: [] });
function emptyBase() { const b = {}; for (const k of COLLS) b[k] = new Map(); return b; }
function canon(v) {
  if (Array.isArray(v)) return "[" + v.map(x => x === undefined ? "null" : canon(x)).join(",") + "]";
  if (v && typeof v === "object")
    return "{" + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
  return JSON.stringify(v === undefined ? null : v);
}
function normalizeDb(d) { const o = emptyDb(); for (const k of COLLS) o[k] = Array.isArray(d && d[k]) ? d[k].filter(x => x && x.id) : []; return o; }
function indexDb(d) { const b = emptyBase(); for (const k of COLLS) for (const o of d[k]) b[k].set(o.id, canon(o)); return b; }
function dbFromBase() { const d = emptyDb(); for (const k of COLLS) for (const j of base[k].values()) d[k].push(JSON.parse(j)); return d; }
const opKey = op => op.coll + "/" + op.id;

function diffDb(b, cur) {
  const ops = [];
  for (const k of COLLS) {
    const bm = b[k], seen = new Set();
    for (const o of cur[k]) {
      seen.add(o.id);
      const j = canon(o), was = bm.get(o.id);
      if (was !== j) ops.push({ coll: k, id: o.id, op: "upsert", json: j, base: was === undefined ? null : was });
    }
    for (const [id, was] of bm) if (!seen.has(id)) ops.push({ coll: k, id, op: "delete", json: null, base: was });
  }
  return ops;
}
/* forme transmise au serveur ; "base" n'est utile qu'à la relecture */
const wireOp = (op, withBase) => {
  const w = { coll: op.coll, id: op.id, op: op.op };
  if (op.op === "upsert") w.data = JSON.parse(op.json);
  if (withBase) { const b = draftOrig.has(opKey(op)) ? draftOrig.get(opKey(op)) : op.base; w.base = b ? JSON.parse(b) : null; }
  return w;
};
function applyOps(d, ops) {
  for (const op of ops) {
    const arr = d[op.coll]; if (!arr) continue;
    const i = arr.findIndex(o => o.id === op.id);
    if (op.op === "delete") { if (i >= 0) arr.splice(i, 1); continue; }
    const o = op.data ? JSON.parse(JSON.stringify(op.data)) : JSON.parse(op.json);
    if (i >= 0) arr[i] = o; else arr.push(o);
  }
}
function applyToBase(ops) { for (const op of ops) op.op === "delete" ? base[op.coll].delete(op.id) : base[op.coll].set(op.id, op.json); }

/* compatibilité avec les fichiers antérieurs */
function migrate() {
  db = normalizeDb(db);
  for (const e of db.events) {
    if (e.end === undefined) e.end = e.year;
    if (e.parentId === undefined) e.parentId = null;
    if (!e.arrows) e.arrows = [];
    if (e.lon === undefined) { e.lon = null; e.lat = null; }
    if (!e.kind) e.kind = "jalon";
  }
}

const isLogged = () => !!user;
const canPublish = () => !preview && remoteState === "ok" && (role === "editor" || role === "admin");
const canEdit = () => !preview && (role === "local" || (remoteState === "ok" && (role === "contributor" || role === "editor" || role === "admin")));
function requireEdit() {
  if (canEdit()) return true;
  if (preview) toast("Quittez d'abord l'aperçu de la proposition");
  else if (backend === "supabase" && remoteState !== "ok") toast("Base partagée indisponible : modification impossible pour l'instant");
  else if (backend === "supabase") openAuth("login", "Connectez-vous ou créez un compte pour proposer une modification.");
  return false;
}
const errMsg = e => {
  const m = String((e && (e.message || e.error_description || e.msg)) || e || "erreur inconnue");
  const map = [
    [/invalid login credentials/i, "Adresse ou mot de passe incorrect"],
    [/email not confirmed/i, "Adresse non confirmée : cliquez le lien reçu par e-mail"],
    [/already registered|already been registered/i, "Un compte existe déjà avec cette adresse"],

    [/failed to fetch|networkerror|load failed/i, "Réseau indisponible"],
    [/jwt expired/i, "Session expirée, reconnectez-vous"]
  ];
  for (const [re, fr] of map) if (re.test(m)) return fr;
  return m;
};

/* --- brouillons (contributeurs et mode fichier) --- */
const draftKey = () => DRAFT_KEY + ":" + (backend === "file" ? "local" : (user ? user.id : "anon"));
function storeDraft(ops) {
  try {
    if (!ops.length) { localStorage.removeItem(draftKey()); draftOrig.clear(); return; }
    localStorage.setItem(draftKey(), JSON.stringify({ v: 2, app: APP_VERSION, saved: Date.now(), ops: ops.map(op => wireOp(op, true)) }));
  } catch (e) { setSaveState("brouillon non conservé"); }
}
function applyDraft() {
  draftOrig = new Map();
  let j = null;
  try { j = JSON.parse(localStorage.getItem(draftKey()) || "null"); } catch (e) { j = null; }
  if (!j || !Array.isArray(j.ops) || !j.ops.length) return 0;
  for (const op of j.ops) draftOrig.set(opKey(op), op.base ? canon(op.base) : null);
  applyOps(db, j.ops);
  migrate();
  return j.ops.length;
}
function discardDraft() {
  try { localStorage.removeItem(draftKey()); } catch (e) { }
  draftOrig.clear();
  db = dbFromBase(); history.length = 0;
  if (sel && !resolveSel()) sel = null;
  pendingOps = 0; setSaveState("à jour"); updateChrome(); renderAll();
}

/* --- enregistrement --- */
function setSaveState(t) { $("#saveState").textContent = t; }
function snapshot() { history.push(JSON.stringify(db)); if (history.length > 30) history.shift(); }
function undo() {
  if (!canEdit()) return;
  if (!history.length) return toast("Rien à annuler");
  db = JSON.parse(history.pop());
  if (sel && !resolveSel()) sel = null;
  save(); renderAll(); toast("Modification annulée");
}
function resolveSel() {
  if (!sel) return true;
  const map = { civ: db.civs, poi: db.pois, event: db.events, terr: db.territories, link: db.links, subj: db.subjections, person: db.persons || [] };
  return !!byId(map[sel.type] || [], sel.id);
}
function save() {
  if (preview || !canEdit()) return;
  setSaveState("modifié…");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, 600);
}
async function sync() {
  clearTimeout(syncTimer);
  if (preview) return;
  const ops = diffDb(base, db);
  pendingOps = ops.length;
  if (canPublish()) {
    if (!ops.length) { setSaveState("publié"); updateChrome(); return; }
    if (syncing) { syncTimer = setTimeout(sync, 500); return; }
    syncing = true; setSaveState("publication…");
    try {
      /* par lots (≈ 500 ko) : un enrichissement peut peser plusieurs mégaoctets */
      const batches = []; let cur = [], size = 0;
      for (const op of ops) {
        const n = (op.json || "").length + 80;
        if (cur.length && (size + n > 5e5 || cur.length >= 250)) { batches.push(cur); cur = []; size = 0; }
        cur.push(op); size += n;
      }
      if (cur.length) batches.push(cur);
      for (let i = 0; i < batches.length; i++) {
        if (batches.length > 1) setSaveState(`publication ${i + 1}/${batches.length}…`);
        const { error } = await SB.rpc("apply_changes", { p_changes: batches[i].map(op => wireOp(op, false)) });
        if (error) throw error;
        applyToBase(batches[i]);
      }
      pendingOps = diffDb(base, db).length;
      setSaveState(pendingOps ? "modifié…" : "publié");
      if (pendingOps) syncTimer = setTimeout(sync, 600);
    } catch (e) {
      setSaveState("non publié");
      toast("Publication impossible : " + errMsg(e));
    } finally { syncing = false; }
  } else {
    storeDraft(ops);
    setSaveState(ops.length ? `${ops.length} modif. en attente` : "à jour");
  }
  updateChrome();
}
function mutate(fn) { if (!requireEdit()) return; snapshot(); fn(); save(); }

/* --- chargement --- */
async function loadFile() {
  const r = await fetch("data/atlas.json?v=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("data/atlas.json : HTTP " + r.status);
  const j = await r.json();
  return normalizeDb(j.db || j);
}
async function fetchAllItems() {
  const out = [], step = 1000;
  for (let from = 0; ; from += step) {
    const { data, error } = await SB.from("items").select("coll,id,data").order("coll").order("id").range(from, from + step - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < step) break;
  }
  return out;
}
async function loadPublished() {
  remoteState = "ok";
  if (SB) {
    try {
      const rows = await fetchAllItems();
      if (rows.length) {
        const d = emptyDb();
        for (const r of rows) if (d[r.coll]) d[r.coll].push(r.data);
        db = d; migrate(); base = indexDb(db); lastRefresh = Date.now();
        return;
      }
      remoteState = "empty";
    } catch (e) {
      console.warn("Supabase", e);
      remoteState = "down";
    }
  }
  try { db = await loadFile(); }
  catch (e) { console.error(e); db = emptyDb(); toast("Impossible de lire data/atlas.json"); }
  migrate(); base = indexDb(db); lastRefresh = Date.now();
}
/* recharge l'état publié en conservant les modifications non encore publiées */
async function refreshPublished(quiet) {
  if (preview) endPreview();
  const pend = diffDb(base, db);
  await loadPublished();
  if (pend.length && canEdit()) { applyOps(db, pend.map(op => ({ ...op, data: op.json ? JSON.parse(op.json) : null }))); migrate(); }
  history.length = 0;
  if (sel && !resolveSel()) sel = null;
  if (pend.length) sync(); else setSaveState(backend === "supabase" && remoteState === "ok" ? "à jour" : "fichier");
  updateChrome(); renderAll();
  if (!quiet) toast("Données actualisées");
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && SB && Date.now() - lastRefresh > 10 * 60e3) refreshPublished(true);
});

async function setUser(u, first) {
  const same = (u ? u.id : null) === (user ? user.id : null);
  if (same && !first) { if (u) user = u; updateChrome(); return; }
  /* on range ce qui était en cours sous l'identité précédente */
  if (!first) {
    if (preview) endPreview();
    clearTimeout(syncTimer);
    if (canPublish()) await sync();
    else if (canEdit()) storeDraft(diffDb(base, db));
    db = dbFromBase(); history.length = 0; draftOrig.clear();
  }
  user = u; profile = null; role = "viewer";
  if (u) {

  }
  pendingOps = diffDb(base, db).length;
  setSaveState(pendingOps ? `${pendingOps} modif. en attente` : remoteState === "ok" ? "à jour" : "lecture seule");
  if (sel && !resolveSel()) sel = null;
  if (role === "editor" || role === "admin") refreshReviewCount();

/* --- aperçu d'une proposition sur la carte --- */
function startPreview(p) {
  if (!p.changes) return;
  if (preview) endPreview(true);
  clearTimeout(syncTimer);
  preview = { p, saved: db, savedSel: sel, savedYear: year };
  db = dbFromBase(); applyOps(db, p.changes.map(opWire)); migrate();
  if (sel && !resolveSel()) sel = null;
  /* cadrage sur le premier élément localisable */
  for (const w of p.changes.map(opWire)) {
    const o = w.data || w.base; if (!o) continue;
    if (w.coll === "territories" && o.rings && o.rings.length) { setYear(clamp(Math.round((o.start + (o.end ?? o.start)) / 2), Y0, Y1), true); fitTo(o.rings); break; }
    if (w.coll === "pois" && o.lon !== null && o.lon !== undefined) { setYear(clamp(o.start, Y0, Y1), true); fitTo([[[o.lon - 5, o.lat - 4], [o.lon + 5, o.lat + 4]]]); break; }
    if (w.coll === "events" && o.lon !== null && o.lon !== undefined) { setYear(clamp(o.year, Y0, Y1), true); fitTo([[[o.lon - 5, o.lat - 4], [o.lon + 5, o.lat + 4]]]); break; }
  }

}

  db = preview.saved; sel = preview.savedSel; preview = null;

  } else if (backend === "supabase" && remoteState === "empty") {
    bn.hidden = false; bn.textContent = role === "admin" ? "La base partagée est vide : initialisez-la depuis l'onglet Données." : "Atlas en cours d'initialisation : lecture seule.";
  } else bn.hidden = true;
}

/* =====================  PROJECTION / CARTE  ===================== */
const map = $("#map");
const gGrid = $("#gGrid"), gLand = $("#gLand"), gLake = $("#gLake"), gRiver = $("#gRiver"),
      gTerr = $("#gTerr"), gLab = $("#gTerrLabels"), gEvent = $("#gEvent"),
      gPoi = $("#gPoi"), gEdit = $("#gEdit"), defs = $("#defs"), gRelief = $("#gRelief");

const px = () => view.w / (map.clientWidth || 1);   // degrés par pixel
function applyView() {
  const r = map.clientHeight / (map.clientWidth || 1);
  view.h = view.w * r;
  view.x = clamp(view.x, -180 - view.w * .25, 180 - view.w * .75);
  /* si la carte tient en hauteur, on la centre au lieu de la laisser flotter */
  view.y = view.h >= 176 ? -view.h / 2 - 6 : clamp(view.y, -95, 95 - view.h * .5);
  map.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  updateDetail(); updateRelief();
}
const toXY = ([lon, lat]) => [lon, -lat];
function ringD(ring) {
  if (!ring || ring.length < 2) return "";
  return "M" + ring.map(p => { const [x, y] = toXY(p); return +x.toFixed(3) + "," + +y.toFixed(3); }).join("L") + "Z";
}
const pathD = rings => (rings || []).map(ringD).join(" ");
function centroid(rings) {
  let bx = 0, by = 0, ba = 0;
  for (const r of rings || []) {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0; i < r.length; i++) {
      const [x1, y1] = r[i], [x2, y2] = r[(i + 1) % r.length];
      const f = x1 * y2 - x2 * y1; a += f; cx += (x1 + x2) * f; cy += (y1 + y2) * f;
    }
    a = a / 2; if (!a) continue;
    if (Math.abs(a) > Math.abs(ba)) { ba = a; bx = cx / (6 * a); by = cy / (6 * a); }
  }
  return [bx, by, Math.abs(ba)];
}
function clientToGeo(ev) {
  const p = map.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  const q = p.matrixTransform(map.getScreenCTM().inverse());
  return [Math.round(q.x * 1000) / 1000, Math.round(-q.y * 1000) / 1000];
}

/* fond de carte : Natural Earth 1:50M en vue d'ensemble, tuiles 1:10M au zoom */
const GEO = { base: null, T: 10, tiles: new Set(), nodes: new Map(), loading: new Set(), failed: new Map(), want: new Set(), baseShown: true };
const DETAIL_W = 48;   // largeur de vue (degrés) sous laquelle les tuiles détaillées se chargent
const lineStr = pts => "M" + pts.map(p => p[0] + "," + (-p[1])).join("L");
const ringsStr = rings => rings.map(r => lineStr(r) + "Z").join("");
/* traits de côte d'une tuile : contours sans les segments posés sur le bord de la tuile */
function tileEdges(rings, x0, y0, T) {
  const x1 = x0 + T, y1 = y0 + T, out = [];
  const onEdge = (a, b) => (a[0] === b[0] && (a[0] === x0 || a[0] === x1)) || (a[1] === b[1] && (a[1] === y0 || a[1] === y1));
  for (const r of rings) {
    let cur = [r[0]];
    for (let i = 1; i < r.length; i++) {
      if (onEdge(r[i - 1], r[i])) { if (cur.length > 1) out.push(cur); cur = [r[i]]; }
      else cur.push(r[i]);
    }
    if (cur.length > 1) out.push(cur);
  }
  return out;
}
const gDLand = svgEl("g"), gDLake = svgEl("g"), gDRiver = svgEl("g");
let gBLand = null, gBLake = null, gBRiver = null;
async function loadGeo() {
  try {
    const r = await fetch("data/geo/base.json?v=" + APP_VERSION);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    GEO.base = j; GEO.T = j.tile || 10; GEO.tiles = new Set(j.tiles || []);
    drawLand(); updateDetail();
  } catch (e) { console.error(e); toast("Fond de carte introuvable (data/geo/base.json)"); }
}
function drawLand() {
  gLand.textContent = ""; gLake.textContent = ""; gRiver.textContent = "";
  if (!GEO.base) return;
  gBLand = svgEl("path", { class: "land", d: ringsStr(GEO.base.land), "fill-rule": "evenodd" });
  gBLake = svgEl("path", { class: "lake", d: ringsStr(GEO.base.lakes), "fill-rule": "evenodd" });
  gBRiver = svgEl("path", { class: "river", d: GEO.base.rivers.map(lineStr).join("") });
  gLand.append(gBLand, gDLand); gLake.append(gBLake, gDLake); gRiver.append(gBRiver, gDRiver);
  drawRivers();
}
function drawRivers() { gRiver.style.display = show.rivers ? "" : "none"; }
function neededTiles() {
  const T = GEO.T, out = new Set();
  if (!GEO.base || view.w > DETAIL_W) return out;
  const lon0 = Math.floor((view.x - T * .5) / T) * T, lon1 = view.x + view.w + T * .5;
  const lat1 = -view.y + T * .5, lat0 = Math.floor((-(view.y + view.h) - T * .5) / T) * T;
  for (let x = Math.max(lon0, -180); x < Math.min(lon1, 180); x += T)
    for (let y = Math.max(lat0, -90); y < Math.min(lat1, 90); y += T) {
      const k = x + "_" + y;
      if (GEO.tiles.has(k)) out.add(k);
    }
  return out;
}
function updateDetail() {
  if (!GEO.base) return;
  const need = neededTiles();
  GEO.want = need;
  for (const [k, n] of GEO.nodes) {
    const on = need.has(k) ? "" : "none";
    if (n.l.style.display !== on) { n.l.style.display = on; n.k.style.display = on; n.r.style.display = on; }
  }
  let missing = 0;
  for (const k of need) {
    if (GEO.nodes.has(k) || Date.now() - (GEO.failed.get(k) || 0) < 30e3) continue;
    missing++;
    if (!GEO.loading.has(k)) loadTile(k);
  }
  /* le fond 1:50M reste visible tant qu'une tuile utile manque */
  const showBase = !need.size || missing > 0;
  if (showBase !== GEO.baseShown) {
    GEO.baseShown = showBase;
    const d = showBase ? "" : "none";
    gBLand.style.display = d; gBLake.style.display = d; gBRiver.style.display = d;
  }
}
async function loadTile(k) {
  GEO.loading.add(k);
  try {
    const r = await fetch(`data/geo/t/${k}.json?v=${APP_VERSION}`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const t = await r.json();
    const [x0, y0] = k.split("_").map(Number), T = GEO.T;
    const n = { l: svgEl("g"), k: svgEl("g"), r: svgEl("g") };
    if (t.l) {
      n.l.append(svgEl("path", { class: "dland", d: ringsStr(t.l), "fill-rule": "evenodd" }));
      n.l.append(svgEl("path", { class: "dcoast", d: tileEdges(t.l, x0, y0, T).map(lineStr).join("") }));
    }
    if (t.k) {
      n.k.append(svgEl("path", { class: "dlake", d: ringsStr(t.k), "fill-rule": "evenodd" }));
      n.k.append(svgEl("path", { class: "dshore", d: tileEdges(t.k, x0, y0, T).map(lineStr).join("") }));
    }
    if (t.r) n.r.append(svgEl("path", { class: "river", d: t.r.map(lineStr).join("") }));
    gDLand.append(n.l); gDLake.append(n.k); gDRiver.append(n.r);
    GEO.nodes.set(k, n);
  } catch (e) { console.warn("tuile", k, e); GEO.failed.set(k, Date.now()); }
  finally { GEO.loading.delete(k); updateDetail(); }
}
/* relief ombré : Natural Earth Shaded Relief, combiné au fond en mode « produit »
   (le groupe entier est fusionné, les tuiles détaillées recouvrent l'image d'ensemble) */
const RELIEF = { idx: null, set: new Set(), nodes: new Map(), T: 30 };
const RELIEF_W = 110;   // largeur de vue (degrés) sous laquelle les tuiles détaillées s'affichent
async function loadRelief() {
  try {
    const r = await fetch("data/geo/relief/index.json?v=" + APP_VERSION);
    if (!r.ok) throw new Error("HTTP " + r.status);
    RELIEF.idx = await r.json(); RELIEF.T = RELIEF.idx.tile || 30; RELIEF.set = new Set(RELIEF.idx.tiles || []);
    gRelief.append(svgEl("image", { href: "data/geo/relief/world.jpg?v=" + APP_VERSION, x: -180, y: -90, width: 360, height: 180, preserveAspectRatio: "none" }));
    drawRelief();

}
function drawRelief() { gRelief.style.display = show.relief ? "" : "none"; updateRelief(); }
function updateRelief() {
  if (!RELIEF.idx || !show.relief) return;
  const T = RELIEF.T, need = new Set();
  if (view.w <= RELIEF_W) {
    const lon0 = Math.floor(view.x / T) * T, lon1 = view.x + view.w;
    const lat0 = Math.floor(-(view.y + view.h) / T) * T, lat1 = -view.y;
    for (let x = Math.max(lon0, -180); x < Math.min(lon1, 180); x += T)
      for (let y = Math.max(lat0, -90); y < Math.min(lat1, 90); y += T) {
        const k = x + "_" + y;
        if (RELIEF.set.has(k)) need.add(k);
      }
  }
  for (const [k, n] of RELIEF.nodes) { const d = need.has(k) ? "" : "none"; if (n.style.display !== d) n.style.display = d; }
  for (const k of need) if (!RELIEF.nodes.has(k)) {
    const [x, y] = k.split("_").map(Number);
    const n = svgEl("image", { href: `data/geo/relief/${k}.jpg?v=${APP_VERSION}`, x, y: -(y + T), width: T, height: T, preserveAspectRatio: "none" });
    gRelief.append(n); RELIEF.nodes.set(k, n);
  }
}

/* hachures : une trame par civilisation, dans l'esprit des planches d'atlas gravées */
function syncPatterns() {
  const k = px() * 7;
  for (const c of db.civs) for (const inv of [0, 1]) {
    const id = (inv ? "x" : "h") + c.id;
    let p = defs.querySelector("#" + CSS.escape(id));
    if (!p) {
      p = svgEl("pattern", { id, patternUnits: "userSpaceOnUse", patternTransform: "rotate(" + (inv ? -45 : 45) + ")" });
      p.append(svgEl("rect", { width: 100, height: 100, x: -50, y: -50 }));
      p.append(svgEl("line", { y1: -50, y2: 50, "stroke-linecap": "square" }));
      defs.append(p);
    }
    p.setAttribute("width", k); p.setAttribute("height", k);
    const [rect, line] = p.children;
    rect.setAttribute("fill", c.color); rect.setAttribute("opacity", inv ? 0 : .14);
    line.setAttribute("x1", 0); line.setAttribute("x2", 0);
    line.setAttribute("stroke", c.color); line.setAttribute("stroke-width", k * (inv ? .26 : .3));
    line.setAttribute("opacity", inv ? .62 : .5);
  }
}

function activeTerrs() {
  const out = [];
  for (const t of db.territories) {
    if (!alive(t)) continue;
    const c = civ(t.civId); if (!c) continue;
    out.push({ t, c, area: centroid(t.rings)[2] });
  }
  return out.sort((a, b) => b.area - a.area);
}

        if (p.kind === "capitale") g.append(svgEl("circle", { cx: p.lon, cy: -p.lat, r: r * 2.2, fill: "none", stroke: col, "stroke-width": .9 * s, "stroke-opacity": .55 }));

/* --- mouvements : courbe lissée et pointe de flèche --- */
function smoothD(pts) {
  const P = pts.map(q => [q[0], -q[1]]);
  if (P.length < 3) return "M" + P.map(q => q.join(",")).join("L");
  let d = "M" + P[0].join(",");
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function headD(pts, size) {
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  const ang = Math.atan2(-(b[1] - a[1]), b[0] - a[0]);
  const t = [b[0], -b[1]];
  const l = [t[0] - size * Math.cos(ang - .42), t[1] - size * Math.sin(ang - .42)];
  const r = [t[0] - size * Math.cos(ang + .42), t[1] - size * Math.sin(ang + .42)];
  return `M${t[0]},${t[1]}L${l[0]},${l[1]}L${r[0]},${r[1]}Z`;
}
/* Un événement cartographié s'affiche à sa date ; sélectionné, il entraîne
   avec lui ses étapes, son épisode parent et ses étapes sœurs. */
function visibleEvents() {
  const id = sel && sel.type === "event" ? sel.id : null;
  const cur = id ? byId(db.events, id) : null;
  const out = [];
  for (const e of db.events) {
    if (!evHasGeo(e)) continue;
    const kin = !!cur && (e.id === id || e.parentId === id || e.id === cur.parentId ||
      (cur.parentId && e.parentId === cur.parentId));
    if (kin || evAlive(e)) out.push({ e, on: kin });
  }
  return out;
}
function renderEvents() {
  const s = px(), fs = 10.5 * s;
  for (const { e, on } of visibleEvents()) {
    const c = e.civId ? civ(e.civId) : null;
    const col = on ? "#9d3d2d" : "#6b4a42";
    const pick = ev => { ev.stopPropagation(); if (mode === "select") select("event", e.id); };
    for (const a of e.arrows || []) {
      if (!a.pts || a.pts.length < 2) continue;
      const g = svgEl("g", { class: "mvt" });
      g.append(svgEl("path", {
        d: smoothD(a.pts), fill: "none", stroke: col, "stroke-width": (on ? 2.4 : 1.8) * s,
        "stroke-linecap": "round", "stroke-opacity": on ? .95 : .6,
        "stroke-dasharray": a.dash ? `${7 * s} ${5 * s}` : null
      }));
      g.append(svgEl("path", { d: headD(a.pts, 9 * s), fill: col, "fill-opacity": on ? .95 : .6 }));
      g.append(svgEl("path", { d: smoothD(a.pts), fill: "none", stroke: "transparent", "stroke-width": 10 * s }));
      if (a.label && show.labels && on) {
        const m = a.pts[Math.floor(a.pts.length / 2)];
        g.append(Object.assign(svgEl("text", {
          class: "mvt-label", x: m[0], y: -m[1] - fs, "font-size": fs, "stroke-width": fs * .3, fill: col
        }), { textContent: a.label }));
      }
      g.addEventListener("click", pick);
      g.addEventListener("pointerenter", ev => showTip(ev, `<b>${esc(a.label || "Mouvement")}</b><br><span class="yr">${esc(e.title)}</span>`));
      g.addEventListener("pointermove", moveTip);
      g.addEventListener("pointerleave", hideTip);
      gEvent.append(g);
    }
    if (e.lon !== null && e.lon !== undefined) {

      if (e.kind === "bataille" || e.kind === "siege") {
        g.append(svgEl("path", {
          d: `M${e.lon - r},${-e.lat - r}L${e.lon + r},${-e.lat + r}M${e.lon + r},${-e.lat - r}L${e.lon - r},${-e.lat + r}`,
          stroke: col, "stroke-width": 2 * s, fill: "none"
        }));
        if (e.kind === "siege") g.append(svgEl("circle", { cx: e.lon, cy: -e.lat, r: r * 1.8, fill: "none", stroke: col, "stroke-width": 1.1 * s }));
      } else {
        g.append(svgEl("path", {
          d: `M${e.lon},${-e.lat - r}L${e.lon + r},${-e.lat}L${e.lon},${-e.lat + r}L${e.lon - r},${-e.lat}Z`,
          fill: col, "fill-opacity": .85, stroke: "#f7f7f5", "stroke-width": s
        }));
      }
      g.append(svgEl("circle", { cx: e.lon, cy: -e.lat, r: r * 2.6, fill: "transparent" }));
      if (show.labels && (on || s < .06)) g.append(Object.assign(svgEl("text", {
        class: "poi-label", x: e.lon + r * 1.8, y: -e.lat - r * 1.1, "font-size": fs,
        "stroke-width": fs * .3, fill: col, "font-weight": on ? 600 : 400
      }), { textContent: e.title }));
      g.addEventListener("click", pick);
      g.addEventListener("pointerenter", ev => showTip(ev, `<b>${esc(e.title)}</b><br><span class="yr">${evLong(e) ? fmtSpan(e.year, evEnd(e)) : fmtYear(e.year, true)}${c ? " · " + esc(c.name) : ""}</span>`));
      g.addEventListener("pointermove", moveTip);
      g.addEventListener("pointerleave", hideTip);
      gEvent.append(g);
    }
  }
}

/* couche d'édition : tracé en cours + poignées de sommets */
function drawEditLayer() {
  gEdit.textContent = "";
  const s = px();
  if (draft && draft.pts.length) {
    const arrow = draft.kind === "arrow";
    const d = draft.pts.length > 1 ? (arrow ? smoothD(draft.pts) : ringD(draft.pts)) : "";
    if (d) gEdit.append(svgEl("path", { class: "draft", d, fill: arrow ? "none" : null }));
    draft.pts.forEach((p, i) => gEdit.append(svgEl("circle", { class: "vtx", cx: p[0], cy: -p[1], r: 3.4 * s })));
  }
  if (mode === "editGeom" && editArrow) {
    const ev0 = byId(db.events, editArrow.evId), a = ev0 && (ev0.arrows || [])[editArrow.i];
    if (!a) return;
    gEdit.append(svgEl("path", { class: "draft", d: smoothD(a.pts), fill: "none" }));
    a.pts.forEach((p, i) => {
      const c = svgEl("circle", { class: "vtx", cx: p[0], cy: -p[1], r: 4.2 * s });
      c.addEventListener("pointerdown", e2 => {
        e2.stopPropagation();
        if (e2.altKey) { if (a.pts.length > 2) { mutate(() => a.pts.splice(i, 1)); renderMap(); } return; }
        c.setPointerCapture(e2.pointerId); snapshot();
        const mv = m => { const g2 = clientToGeo(m); a.pts[i] = g2; c.setAttribute("cx", g2[0]); c.setAttribute("cy", -g2[1]); gEdit.querySelector("path.draft").setAttribute("d", smoothD(a.pts)); };
        const up = () => { c.removeEventListener("pointermove", mv); c.removeEventListener("pointerup", up); save(); renderMap(); };
        c.addEventListener("pointermove", mv); c.addEventListener("pointerup", up);
      });
      gEdit.append(c);
      if (i < a.pts.length - 1) {
        const q = a.pts[i + 1];
        const m = svgEl("circle", { class: "vtx mid", cx: (p[0] + q[0]) / 2, cy: -(p[1] + q[1]) / 2, r: 2.8 * s });
        m.addEventListener("pointerdown", e2 => { e2.stopPropagation(); mutate(() => a.pts.splice(i + 1, 0, [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2])); renderMap(); });
        gEdit.append(m);
      }
    });
    return;
  }
  if (mode === "editGeom" && editTerrId) {
    const t = byId(db.territories, editTerrId); if (!t) return;
    t.rings.forEach((ring, ri) => {
      gEdit.append(svgEl("path", { class: "draft", d: ringD(ring) }));
      ring.forEach((p, i) => {
        const q = ring[(i + 1) % ring.length];
        const m = svgEl("circle", { class: "vtx mid", cx: (p[0] + q[0]) / 2, cy: -(p[1] + q[1]) / 2, r: 2.6 * s });
        m.addEventListener("pointerdown", e => {
          e.stopPropagation();
          mutate(() => ring.splice(i + 1, 0, [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]));
          renderMap();
        });
        gEdit.append(m);
        const c = svgEl("circle", { class: "vtx", cx: p[0], cy: -p[1], r: 4 * s });
        c.addEventListener("pointerdown", e => {
          e.stopPropagation();
          if (e.altKey) { if (ring.length > 3) { mutate(() => ring.splice(i, 1)); renderMap(); } return; }
          c.setPointerCapture(e.pointerId);
          const mv = ev => { const g2 = clientToGeo(ev); ring[i] = g2; c.setAttribute("cx", g2[0]); c.setAttribute("cy", -g2[1]); redrawEditPaths(t); };
          const up = () => { c.removeEventListener("pointermove", mv); c.removeEventListener("pointerup", up); save(); renderMap(); };
          snapshot();
          c.addEventListener("pointermove", mv); c.addEventListener("pointerup", up);
        });
        gEdit.append(c);
      });
    });
  }
}
function redrawEditPaths(t) {
  const paths = [...gEdit.querySelectorAll("path.draft")];
  t.rings.forEach((r, i) => paths[i] && paths[i].setAttribute("d", ringD(r)));
  const tp = gTerr.querySelector(`g[data-terr="${t.id}"] path`);
  if (tp) tp.setAttribute("d", pathD(t.rings));
}

/* infobulle */
const tip = $("#tip");
function showTip(e, html) { if (e.pointerType === "touch") return; tip.innerHTML = html; tip.classList.add("on"); moveTip(e); }
function moveTip(e) {
  const r = $(".mapwrap").getBoundingClientRect();
  tip.style.left = clamp(e.clientX - r.left + 12, 4, r.width - tip.offsetWidth - 4) + "px";
  tip.style.top = clamp(e.clientY - r.top + 14, 4, r.height - tip.offsetHeight - 4) + "px";
}
function hideTip() { tip.classList.remove("on"); }
/* =====================  INTERACTIONS CARTE  ===================== */
/* Le déplacement de la carte s'écoute sur la fenêtre : capturer le pointeur sur
   le SVG redirigerait vers lui tous les clics, et plus rien ne serait cliquable. */
let panning = null, moved = 0;
function panMove(e) {
  if (!panning) return;
  const s = px(), dx = (e.clientX - panning.x) * s, dy = (e.clientY - panning.y) * s;
  moved = Math.max(moved, Math.abs(e.clientX - panning.x) + Math.abs(e.clientY - panning.y));   // en pixels
  view.x = panning.vx - dx; view.y = panning.vy - dy; applyView();
}
function panEnd() {
  window.removeEventListener("pointermove", panMove);
  window.removeEventListener("pointerup", panEnd);
  window.removeEventListener("pointercancel", panEnd);
  map.classList.remove("grabbing");
  setTimeout(() => { panning = null; }, 0);   // laisse passer le clic qui suit
}
map.addEventListener("pointerdown", e => {
  if (touches.size > 1) return;
  moved = 0;                                   // chaque appui repart de zéro, y compris en mode tracé ou placement
  if (e.target.closest(".vtx")) return;
  /* la carte se fait glisser dans tous les modes ; un appui sans déplacement reste un clic */
  panning = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  map.classList.add("grabbing");
  window.addEventListener("pointermove", panMove);
  window.addEventListener("pointerup", panEnd);
  window.addEventListener("pointercancel", panEnd);
});
map.addEventListener("pointermove", e => {
  const g = clientToGeo(e);
  const nd = view.w < 12 ? 3 : view.w < 60 ? 2 : 1;
  $("#coords").textContent = `${Math.abs(g[1]).toFixed(nd)}°${g[1] >= 0 ? "N" : "S"}  ${Math.abs(g[0]).toFixed(nd)}°${g[0] >= 0 ? "E" : "O"}`;
});
map.addEventListener("pointerup", e => {
  if (moved > (e.pointerType === "touch" ? 10 : 5)) return;   // c'était un déplacement, pas un clic
  if (mode === "drawTerr" || mode === "drawArrow") { addDraftPoint(clientToGeo(e)); return; }
  if (mode === "placePoi") { const g = clientToGeo(e); setMode("select"); openPoiForm(null, { lon: g[0], lat: g[1] }); return; }
  if (mode === "placeEvPt") {
    const g = clientToGeo(e), id = modeTarget, ev = byId(db.events, id);
    setMode("select");
    if (ev) { mutate(() => { ev.lon = g[0]; ev.lat = g[1]; }); select("event", id, { keepYear: true }); toast("Lieu placé"); }
    return;
  }
  if (mode === "select" && !e.target.closest(".terr,.poi,.evm,.mvt")) select(null);
});
map.addEventListener("pointerleave", () => { hideTip(); $("#coords").textContent = ""; });
map.addEventListener("dblclick", e => {
  if (mode === "drawTerr" || mode === "drawArrow") { e.preventDefault(); finishDraft(); return; }
  if (mode === "select" && !e.target.closest(".vtx")) { const g = clientToGeo(e); zoomMap(e.shiftKey ? 2 : .5, g[0], g[1]); }
});
map.addEventListener("wheel", e => {
  e.preventDefault();
  const g = clientToGeo(e), f = Math.exp(e.deltaY * 0.0016);
  const nw = clamp(view.w * f, 0.8, 400);
  const rx = (g[0] - view.x) / view.w, ry = (-g[1] - view.y) / view.h;
  view.x = g[0] - rx * nw; view.w = nw;
  const nh = nw * (map.clientHeight / map.clientWidth);
  view.y = -g[1] - ry * nh;
  applyView(); scheduleMap();
}, { passive: false });

let mapRAF = null;
function scheduleMap() { if (mapRAF) return; mapRAF = requestAnimationFrame(() => { mapRAF = null; renderMap(); }); }
window.addEventListener("resize", () => { applyView(); scheduleMap(); renderTimeline(); });

function fitTo(rings) {
  const pts = [].concat(...(rings || []));
  if (!pts.length) return;
  let x0 = 180, x1 = -180, y0 = 90, y1 = -90;
  for (const [lo, la] of pts) { x0 = Math.min(x0, lo); x1 = Math.max(x1, lo); y0 = Math.min(y0, la); y1 = Math.max(y1, la); }
  const w = Math.max(x1 - x0, 6) * 1.5;
  view.w = clamp(w, 6, 400);
  view.x = (x0 + x1) / 2 - view.w / 2;
  applyView();
  view.y = -(y0 + y1) / 2 - view.h / 2;
  applyView(); scheduleMap();
}
function fitWorld() {
  /* en portrait, le monde entier tiendrait dans un bandeau : on cadre l'Ancien Monde */
  if (map.clientHeight > map.clientWidth * 1.1) {
    view = { x: -25, y: -90, w: 130, h: 180 }; applyView();
    view.y = -32 - view.h / 2; applyView(); scheduleMap(); return;
  }
  view = { x: -180, y: -90, w: 360, h: 180 };
  applyView();
  view.y = -12 - view.h / 2;   /* recentré sur les terres émergées, non sur l'équateur */
  applyView(); scheduleMap();
}

/* --- tracé de territoire --- */
function setMode(m, opts = {}) {
  if (m !== "select" && !requireEdit()) return;
  mode = m; draft = null; modeTarget = opts.target || null;
  if (m !== "editGeom") { editTerrId = null; editArrow = null; }
  map.classList.toggle("drawing", m === "drawTerr" || m === "drawArrow" || m === "placePoi" || m === "placeEvPt");
  $("#tSelect").classList.toggle("on", m === "select");
  $("#tTerr").classList.toggle("on", m === "drawTerr");
  $("#tPoi").classList.toggle("on", m === "placePoi");
  const h = $("#hint");
  if (m === "drawTerr") {
    draft = { kind: "terr", pts: [], civId: opts.civId || selCiv()?.id || null, appendTo: opts.appendTo || null };
    h.style.display = "flex";
    h.innerHTML = `Cliquez pour poser les sommets. <kbd>Entrée</kbd> ferme · <kbd>⌫</kbd> annule le dernier · <kbd>Échap</kbd> abandonne`;
    h.append(el("button", { class: "btn sm prim", onclick: finishDraft }, "Terminer"));
  } else if (m === "drawArrow") {
    draft = { kind: "arrow", pts: [], evId: opts.target };
    h.style.display = "flex";
    h.innerHTML = `Cliquez les étapes du mouvement, du départ vers l'arrivée. <kbd>Entrée</kbd> termine · <kbd>⌫</kbd> annule le dernier point`;
    h.append(el("button", { class: "btn sm prim", onclick: finishDraft }, "Terminer"));
  } else if (m === "placePoi") {
    h.style.display = "flex"; h.innerHTML = `Cliquez à l'emplacement du lieu. <kbd>Échap</kbd> annule`;
  } else if (m === "placeEvPt") {
    h.style.display = "flex"; h.innerHTML = `Cliquez là où se déroule l'événement. <kbd>Échap</kbd> annule`;
  } else if (m === "editGeom") {
    h.style.display = "flex";
    h.innerHTML = `Glissez les sommets · points pâles = ajouter · <kbd>Alt</kbd>+clic = supprimer`;
    if (editTerrId) h.append(el("button", { class: "btn sm", onclick: () => { setMode("drawTerr", { appendTo: editTerrId }); } }, "+ Partie"));
    h.append(el("button", { class: "btn sm prim", onclick: () => setMode("select") }, "Terminer"));
  } else { h.style.display = "none"; h.innerHTML = ""; }
  renderMap();
}
function addDraftPoint(g) { draft.pts.push(g); drawEditLayer(); }
function finishDraft() {
  if (draft && draft.kind === "arrow") {
    if (draft.pts.length < 2) { toast("Il faut au moins deux étapes"); return; }
    const pts = draft.pts.slice(), ev = byId(db.events, draft.evId);
    setMode("select");
    if (ev) openArrowForm(ev, null, pts);
    return;
  }
  if (!draft || draft.pts.length < 3) { toast("Il faut au moins trois sommets"); return; }
  const ring = draft.pts.slice(), target = draft.appendTo;
  if (target) {
    const t = byId(db.territories, target);
    mutate(() => t.rings.push(ring));
    editTerrId = target; setMode("editGeom"); toast("Partie ajoutée");
    return;
  }
  const cid = draft.civId;
  setMode("select");
  openTerrForm(null, { civId: cid, rings: [ring] });
}

/* =====================  SÉLECTION  ===================== */
function select(type, id, opts = {}) {
  sel = type ? { type, id } : null;
  if (sel && sel.type === "civ" && !opts.keepYear) {
    const c = civ(id);
    if (c && !alive(c)) setYear(clamp(year, c.start, c.end ?? Y1), true);
  }
  if (sel && sel.type === "event") { const e = byId(db.events, id); if (e) setYear(e.year, true); }
  if (sel && sel.type === "terr") { const t = byId(db.territories, id); if (t) { setYear(clamp(year, t.start, t.end ?? Y1), true); if (opts.fit !== false) fitTo(t.rings); } }
  if (sel && sel.type === "person") { const p = person(id); if (p && p.start !== null && p.start !== undefined) setYear(clamp(year, p.start, p.end ?? p.start), true); }
  const prevEnt = tlEnt && tlEnt.type + tlEnt.id;
  focusFromSel();
  if (tlEnt && tlEnt.type + tlEnt.id !== prevEnt) $("#lanes").scrollTop = 0;
  if (sel && sel.type === "poi" && opts.fit) { const p = byId(db.pois, sel.id); if (p) fitTo([[[p.lon - 6, p.lat - 5], [p.lon + 6, p.lat + 5]]]); }
  if (tab === "data" || tab === "props") tab = "sheet";
  if (sel) revealSheet();
  renderAll();
  followSelection(!!tlEnt && tlEnt.type + tlEnt.id !== prevEnt);
  $(".panel").scrollTop = 0;
}
function setYear(y, silent) {
  year = clamp(Math.round(y), Y0, Y1);
  $("#yearNum").textContent = Math.abs(year) || 1;
  $("#yearEra").textContent = year < 0 ? "AV. J.-C." : "AP. J.-C.";
  const yr = $("#yearRange"); if (yr && +yr.value !== year) yr.value = year;
  positionPlayhead();
  scheduleMap();
  if (!silent) { updateBarsLive(); renderPanel(); }
}

/* =====================  FRISE  ===================== */
const tlBody = $("#tlBody"), ruler = $("#ruler"), evBand = $("#evBand"), laneIn = $("#laneIn"), playhead = $("#playhead"), tlNav = $("#tlNav"), tlNavWin = $("#tlNavWin");
const tlW = () => tlBody.clientWidth || 1;
const yToX = y => (y - tview.a) / (tview.b - tview.a) * tlW();
const xToY = x => tview.a + x / tlW() * (tview.b - tview.a);

function tlVisibleCivs() {
  let list = db.civs.slice();
  if (tlFilter === "live") list = list.filter(c => alive(c));
  if (tlFilter === "sel") { const c = selCiv(); list = c ? [c] : []; }
  return list.sort((a, b) => a.start - b.start || (a.end ?? Y1) - (b.end ?? Y1));
}
function renderTimeline() {
  /* règle graduée */
  ruler.textContent = "";
  const span = tview.b - tview.a, w = tlW();
  const steps = [2000, 1000, 500, 250, 100, 50, 25, 10, 5, 1];
  let step = steps[0];
  for (const st of steps) if (st / span * w >= 74) step = st;
  const start = Math.ceil(tview.a / step) * step;
  for (let y = start; y <= tview.b; y += step) {
    const x = yToX(y); if (x < -40 || x > w + 40) continue;
    const t = el("div", { class: "tk", style: `left:${x}px` }, el("span", {}, fmtYear(y, false)));
    ruler.append(t);
  }
  const sub = step / (step % 4 === 0 ? 4 : step % 5 === 0 ? 5 : 2);
  if (sub / span * w > 9) for (let y = Math.ceil(tview.a / sub) * sub; y <= tview.b; y += sub) {
    if (Math.abs(y % step) < 1e-6) continue;
    ruler.append(el("div", { class: "tk minor", style: `left:${yToX(y)}px` }));
  }

  tlBody.classList.toggle("focus", !!focusEnt());
  if (focusEnt()) { renderFocusTL(w); positionPlayhead(); return; }

  /* bande d'événements : épisodes longs en barres, jalons en repères, étapes au second rang */
  evBand.textContent = "";
  const c = selCiv();
  const evs = c ? evOf(c.id) : db.events;
  evBand.append(el("span", { class: "eyebrow lbl" }, c ? `Événements · ${c.name}` : `Événements · tous (${evs.length})`));
  const selEv = sel && sel.type === "event" ? sel.id : null;
  for (const e of evs) {
    const row = e.parentId ? " r1" : "";
    const x0 = yToX(e.year), x1 = yToX(evEnd(e));
    if (x1 < -80 || x0 > w + 80) continue;
    const n = (evLong(e) && x1 - x0 > 3)
      ? el("div", { class: "evs" + row + (selEv === e.id ? " sel" : ""), style: `left:${x0}px;width:${x1 - x0}px` },
        x1 - x0 > 46 ? el("span", {}, e.title) : null)
      : el("div", { class: "ev" + row + (selEv === e.id ? " sel" : ""), style: `left:${x0}px` }, [el("i"), el("b")]);
    n.addEventListener("click", ev => { ev.stopPropagation(); select("event", e.id); });
    n.addEventListener("pointerenter", ev => showTipTL(ev, `<b>${esc(e.title)}</b><br><span class="yr">${evLong(e) ? fmtSpan(e.year, evEnd(e)) : fmtYear(e.year, true)}</span>`));
    n.addEventListener("pointerleave", hideTip);
    evBand.append(n);
  }

  /* Bandes de civilisations. L'empilement suit les filiations : une civilisation
     issue d'une autre reprend si possible sa ligne, à la suite ; sinon la ligne
     libre la plus proche. Les autres comblent les trous à partir du haut. */
  laneIn.textContent = "";
  const list = tlVisibleCivs(), pos = new Map(), selId = c?.id;
  const geo = new Map();
  for (const cv of list) {
    const x0 = yToX(cv.start), x1 = Math.max(yToX(cv.end ?? Y1), x0 + 3);
    if (x1 < -200 || x0 > w + 200) continue;
    geo.set(cv.id, { cv, x0, x1: x0 + Math.max(x1 - x0, 3) });
  }
  const heirs = new Map();
  for (const l of db.links) {
    if (!geo.has(l.from) || !geo.has(l.to)) continue;
    if (!heirs.has(l.from)) heirs.set(l.from, []);
    heirs.get(l.from).push(l.to);
  }
  const lanes = [], place = new Map();
  /* gap négatif : on tolère le chevauchement d'un ou deux pixels pour qu'une
     succession exacte — un empire qui commence l'année où l'autre finit —
     reste sur la même ligne, bord à bord. */
  const fits = (li, g, gap) => !lanes[li].some(iv => g.x0 < iv[1] + gap && iv[0] < g.x1 + gap);
  function findLane(g, pref) {
    const has = pref !== null && pref !== undefined;
    if (has && pref < lanes.length && fits(pref, g, -2)) return pref;
    if (has) for (let d = 1; d <= lanes.length; d++) {
      if (pref + d < lanes.length && fits(pref + d, g, 6)) return pref + d;
      if (pref - d >= 0 && fits(pref - d, g, 6)) return pref - d;
    }
    for (let k = 0; k < lanes.length; k++) if (fits(k, g, 6)) return k;
    lanes.push([]); return lanes.length - 1;
  }
  function assign(id, pref) {
    if (place.has(id)) return;
    const g = geo.get(id); if (!g) return;
    const li = findLane(g, pref);
    lanes[li].push([g.x0, g.x1]); place.set(id, li);
    (heirs.get(id) || []).filter(k => !place.has(k))
      .sort((p, q) => geo.get(p).x0 - geo.get(q).x0)
      .forEach(k => assign(k, li));
  }
  for (const cv of list) if (geo.has(cv.id)) assign(cv.id, null);

  for (const cv of list) {
    const g = geo.get(cv.id); if (!g) continue;
    const li = place.get(cv.id);
    /* le nom reste lisible même quand la bande déborde de la fenêtre */
    const vx = Math.max(g.x0, -1), vw = Math.max(Math.min(g.x1, w + 1) - vx, 3);
    const bar = el("div", {
      class: "bar" + (selId === cv.id ? " sel" : "") + (alive(cv) ? "" : " off"),
      style: `left:${vx}px;width:${vw}px;top:${li * 21}px;background:${cv.color}44;border-color:${cv.color}`,
      title: `${cv.name} · ${fmtSpan(cv.start, cv.end)}`,
      onclick: () => select("civ", cv.id)
    }, el("span", {}, cv.name));
    bar.dataset.civ = cv.id;
    pos.set(cv.id, { x0: g.x0, x1: g.x1, y: li * 21 + 8.5 });
    bar.addEventListener("pointerenter", ev => showTipTL(ev, `<b>${esc(cv.name)}</b><br><span class="yr">${fmtSpan(cv.start, cv.end)}</span>`));
    bar.addEventListener("pointerleave", hideTip);
    laneIn.append(bar);
  }
  /* période de sujétion : la trame de la puissance dominante barre la bande */
  for (const x of db.subjections) {
    const p = pos.get(x.civId), ov = civ(x.overId);
    if (!p || !ov) continue;
    const a = Math.max(yToX(x.start), p.x0), b2 = Math.min(yToX(x.end), p.x1);
    if (b2 - a < 1 || b2 < -40 || a > w + 40) continue;
    const d = el("div", {
      class: "subj", style: `left:${a}px;width:${b2 - a}px;top:${p.y - 8.5}px;--c:${ov.color}`,
      title: `${civ(x.civId)?.name} · ${subjWord(x)} · ${fmtSpan(x.start, x.end)}`,
      onclick: e => { e.stopPropagation(); select("civ", x.overId); }
    });
    d.addEventListener("pointerenter", ev => showTipTL(ev, `<b>${esc(civ(x.civId)?.name)}</b> — ${esc(subjWord(x))}<br><span class="yr">${fmtSpan(x.start, x.end)}</span>`));
    d.addEventListener("pointerleave", hideTip);
    laneIn.append(d);
  }
  laneIn.style.height = Math.max(lanes.length * 21 + 12, 40) + "px";
  drawLinks(pos, lanes.length, w);
  if (!laneIn.children.length) laneIn.append(el("div", { class: "tl-empty" }, tlFilter === "sel" ? "Sélectionnez une civilisation." : "Aucune civilisation dans cette fenêtre."));
  $("#tlCount").textContent = `${list.length} civilisation${list.length > 1 ? "s" : ""}`;
  positionPlayhead();
}
/* Les filiations relient la fin d'une civilisation au début de celle qui en
   procède : un trait fin, mis en évidence quand l'une des deux est choisie. */
function drawLinks(pos, laneCount, w) {
  const old = laneIn.querySelector("svg.filiations"); if (old) old.remove();
  if (!showLinks || !db.links.length) return;
  const h = Math.max(laneCount * 21 + 12, 40);
  const svg = svgEl("svg", { class: "filiations", width: "100%", height: h, viewBox: `0 0 ${Math.max(w, 1)} ${h}`, preserveAspectRatio: "none" });
  const selId = selCiv()?.id;
  let drawn = 0;
  for (const l of db.links) {
    const a = pos.get(l.from), b = pos.get(l.to);
    if (!a || !b) continue;
    const ty = linkYear(l);
    const x1 = ty !== null ? clamp(yToX(ty), a.x0, a.x1) : a.x1;
    const x2 = ty !== null ? clamp(yToX(ty), b.x0, b.x1) : b.x0;
    if (Math.max(x1, x2) < -60 || Math.min(x1, x2) > w + 60) continue;
    const on = selId === l.from || selId === l.to;
    const dx = clamp(Math.abs(x2 - x1) / 2, 8, 26);
    const g = svgEl("g", { class: "lk" + (on ? " on" : "") });
    const d = `M${x1},${a.y} C${x1 + dx},${a.y} ${x2 - dx},${b.y} ${x2},${b.y}`;
    g.append(svgEl("path", { d }));
    g.append(svgEl("path", { class: "hit", d }));
    g.append(svgEl("circle", { cx: x1, cy: a.y, r: 2.2, class: "src" }));
    const dir = x2 >= x1 ? 1 : -1;
    g.append(svgEl("path", { class: "hd", d: `M${x2},${b.y}L${x2 - 5 * dir},${b.y - 3}L${x2 - 5 * dir},${b.y + 3}Z` }));
    const t = svgEl("title");
    t.textContent = `${civ(l.from)?.name} → ${civ(l.to)?.name}${l.label ? " · " + l.label : ""}${ty !== null ? " · " + fmtYear(ty, true) : ""}`;
    g.append(t);
    g.addEventListener("click", e => {
      e.stopPropagation();
      if (l.eventId && byId(db.events, l.eventId)) select("event", l.eventId);
      else select("civ", selId === l.to ? l.from : l.to);
    });
    svg.append(g); drawn++;
  }
  if (drawn) laneIn.append(svg);
}

let tldrag = false;
function tlSetFromEvent(e) {
  const r = tlBody.getBoundingClientRect();
  setYear(xToY(e.clientX - r.left));
}
tlBody.addEventListener("pointerdown", e => {
  if (e.target.closest(".bar,.ev,.evs,.ti,.trk-h,.tl-focus-h,.trk-add,.tl-nav") || e.target.closest("svg.filiations")) return;
  if (e.pointerType === "touch" && e.target.closest(".lanes")) return;   // au doigt, les bandes défilent ; la règle règle l'année
  tldrag = true; tlBody.setPointerCapture(e.pointerId); tlSetFromEvent(e);
});
tlBody.addEventListener("pointermove", e => { if (tldrag) tlSetFromEvent(e); });
tlBody.addEventListener("pointerup", () => { tldrag = false; });
tlBody.addEventListener("wheel", e => {
  const horiz = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
  if (!horiz && !e.ctrlKey && !e.metaKey) return;        // molette seule : on laisse défiler les bandes
  e.preventDefault();
  const r = tlBody.getBoundingClientRect(), px0 = e.clientX - r.left;
  if (horiz) {
    const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / tlW() * (tview.b - tview.a);
    tview.a += d; tview.b += d;
  } else {
    const y = xToY(px0), f = Math.exp(e.deltaY * .0016);
    let a = y - (y - tview.a) * f, b = y + (tview.b - y) * f;
    if (b - a < 25) { const m = (a + b) / 2; a = m - 12.5; b = m + 12.5; }
    if (b - a > (Y1 - Y0) * 1.05) { a = Y0; b = Y1; }
    tview.a = a; tview.b = b;
  }
  clampTView(); renderTimeline();
}, { passive: false });
tlNav.addEventListener("pointerdown", e => {
  e.stopPropagation(); e.preventDefault();
  const r = tlNav.getBoundingClientRect(), R = Y1 - Y0, span = tview.b - tview.a;
  const yAt = x => Y0 + (x - r.left) / r.width * R;
  let off = span / 2;
  if (e.target === tlNavWin) off = yAt(e.clientX) - tview.a;
  else { tview.a = yAt(e.clientX) - off; tview.b = tview.a + span; clampTView(); renderTimeline(); }
  tlNav.setPointerCapture(e.pointerId); tlNav.classList.add("drag");
  const mv = ev => { tview.a = yAt(ev.clientX) - off; tview.b = tview.a + span; clampTView(); renderTimeline(); };
  const up = () => { tlNav.removeEventListener("pointermove", mv); tlNav.removeEventListener("pointerup", up); tlNav.classList.remove("drag"); };
  tlNav.addEventListener("pointermove", mv); tlNav.addEventListener("pointerup", up);
});
function clampTView() {
  const span = tview.b - tview.a;
  if (tview.a < Y0 - span * .05) { tview.a = Y0 - span * .05; tview.b = tview.a + span; }
  if (tview.b > Y1 + span * .05) { tview.b = Y1 + span * .05; tview.a = tview.b - span; }
}
function tlZoom(f) {
  const m = year >= tview.a && year <= tview.b ? year : (tview.a + tview.b) / 2;
  let a = m - (m - tview.a) * f, b = m + (tview.b - m) * f;
  if (b - a < 25) { a = m - 12.5; b = m + 12.5; }
  tview.a = a; tview.b = b; clampTView(); renderTimeline();
}
function tlFocus(a, b) {
  const pad = Math.max((b - a) * .25, 40);
  tview.a = a - pad; tview.b = b + pad; clampTView(); renderTimeline();
}

function delCiv(c) {
  if (!requireEdit()) return;
  const n = terrOf(c.id).length + evOf(c.id).length + poisOf(c.id).length;
  if (!confirm(`Supprimer « ${c.name} » et ses ${n} éléments rattachés ?`)) return;
  mutate(() => {

    /* une entrée partagée survit : la civilisation suivante devient principale */
    db.events = db.events.filter(x => {
      const rest = (x.parts || []).filter(q => q.civId !== c.id);
      if (x.civId === c.id) {
        if (!rest.length) return false;
        x.civId = rest[0].civId; x.civRole = rest[0].role === "concerne" ? undefined : rest[0].role; x.parts = rest.length > 1 ? rest.slice(1) : undefined;
      } else if (x.parts) x.parts = rest.length ? rest : undefined;
      return true;
    });
    for (const p of db.persons || []) if (p.civIds && p.civIds.includes(c.id)) p.civIds = p.civIds.filter(id => id !== c.id);

/* --- périodes et emprises : deux objets indépendants, reliables (territoire.periodId) --- */

/* --- couverture des emprises, suggestions --- */
function coverGaps(c, ts) {
  if (!ts.length) return [];
  const a = c.start, b = c.end ?? Y1, gaps = [];
  const iv = ts.map(t => [Math.max(a, t.start), Math.min(b, t.end ?? Y1)]).filter(x => x[1] >= x[0]).sort((x, y) => x[0] - y[0]);
  let cur = a;
  for (const [s, e] of iv) { if (s > cur + 1) gaps.push([cur + 1, s - 1]); cur = Math.max(cur, e); }
  if (b > cur + 1) gaps.push([cur + 1, b]);

}

  if (L.length <= 5) return L;
  const n = L.length - 1, idx = new Set([0, Math.round(n / 4), Math.round(n / 2), Math.round(3 * n / 4), n]);

/* rattacher à un lieu les entrées dont le point est proche */
function linkNearby(p, km = 30) {
  if (!requireEdit()) return;
  const R = 6371, rad = Math.PI / 180;
  const dist = (a, b) => 2 * R * Math.asin(Math.sqrt(Math.sin((b[1] - a[1]) * rad / 2) ** 2 + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin((b[0] - a[0]) * rad / 2) ** 2));
  const cands = db.events.filter(e => e.lon !== null && e.lon !== undefined && !evPoiIds(e).includes(p.id))
    .map(e => ({ e, d: dist([p.lon, p.lat], [e.lon, e.lat]) })).filter(x => x.d <= km).sort((a, b) => a.d - b.d);
  if (!cands.length) return toast(`Aucune entrée à moins de ${km} km sans lien avec ce lieu`);
  const boxes = cands.map(x => { const cb = el("input", { type: "checkbox" }); cb.checked = true; return { x, cb }; });
  const m = modalShell("Rattacher les entrées proches", [
    el("p", { class: "note", style: "margin:0 0 8px" }, `Entrées localisées à moins de ${km} km de ${p.name}.`),
    ...boxes.map(({ x, cb }) => el("label", { class: "chk-row" }, [cb, el("span", {}, [x.e.title, el("span", { class: "meta" }, ` · ${evSpan(x.e)} · ${Math.round(x.d)} km`)])]))
  ], [el("button", { class: "btn", onclick: () => m.close() }, "Annuler"), el("button", {
    class: "btn prim", onclick: () => {
      const pick = boxes.filter(b => b.cb.checked).map(b => b.x.e);
      if (pick.length) mutate(() => { for (const e of pick) e.poiIds = [...evPoiIds(e), p.id]; });
      m.close(); renderAll(); toast(`${pick.length} entrée(s) rattachée(s)`);
    }
  }, "Rattacher")], "wide");
}
