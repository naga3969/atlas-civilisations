function delCiv(c) {
  if (!requireEdit()) return;
  const n = terrOf(c.id).length + evOf(c.id).length + poisOf(c.id).length;
  if (!confirm(`Supprimer « ${c.name} » et ses ${n} éléments rattachés ?`)) return;
  mutate(() => {
    db.civs = db.civs.filter(x => x.id !== c.id);
    db.territories = db.territories.filter(x => x.civId !== c.id);
    db.events = db.events.filter(x => x.civId !== c.id);
    db.pois = db.pois.filter(x => x.civId !== c.id);
    db.links = db.links.filter(x => x.from !== c.id && x.to !== c.id);
    db.subjections = db.subjections.filter(x => x.civId !== c.id && x.overId !== c.id);
  });
  sel = null; renderAll();
}

/* images manquantes, depuis le premier lien Wikipédia de chaque fiche */
function wikiThumb(j) {
  const o = j && j.originalimage, t = j && j.thumbnail;
  if (!o && !t) return "";
  if (t && o && o.width > 640) return t.source.replace(/\/\d+px-/, "/640px-");
  return (o || t).source;
}
async function fillImages() {
  if (!requireEdit()) return;
  const todo = [];
  for (const [coll, label] of [["civs", "name"], ["pois", "name"], ["events", "title"]])
    for (const o of db[coll]) {
      if (o.image) continue;
      const l = (o.links || []).find(l => /wikipedia\.org\/wiki\//.test(l.url));
      if (l) todo.push({ coll, id: o.id, url: l.url });
    }
  if (!todo.length) return toast("Aucune fiche sans image avec un lien Wikipédia");
  if (!confirm(`Chercher une image Wikipédia pour ${todo.length} fiche(s) ?`)) return;
  const found = [];
  for (let i = 0; i < todo.length; i++) {
    const it = todo[i];
    setSaveState(`images ${i + 1}/${todo.length}`);
    try {
      const m = it.url.match(/https?:\/\/(\w+)\.wikipedia\.org\/wiki\/([^#?]+)/);
      const r = await fetch(`https://${m[1]}.wikipedia.org/api/rest_v1/page/summary/${m[2]}`);
      if (!r.ok) continue;
      const src = wikiThumb(await r.json());
      if (src) found.push({ ...it, src });
    } catch (e) { }
  }
  if (!found.length) { setSaveState("à jour"); return toast("Aucune image trouvée"); }
  mutate(() => {
    for (const f of found) {
      const o = byId(db[f.coll], f.id);
      if (o && !o.image) Object.assign(o, { image: f.src, imageCredit: "Wikimedia Commons, via Wikipédia" });
    }
  });
  renderAll(); toast(`${found.length} image(s) ajoutée(s)`);
}

/* =====================  FORMULAIRES  ===================== */
const PALETTE = ["#8c3b2e", "#2c4a63", "#4a6b45", "#7a5a2e", "#5b4a72", "#2f6b6b", "#a06a2c", "#6b2f45", "#3f5a8a", "#6e7a3a", "#8a5b6b", "#455055"];

function openForm(title, fields, values, onSave, extra) {
  if (!requireEdit()) return { close() { }, state: {}, controls: {} };
  const root = $("#modalRoot"), inline = FORM_TARGET;
  const state = Object.assign({}, values);
  const body = el("div", { class: "body" });
  const controls = {};
  for (const f of fields) {
    if (f.type === "row") {
      const g = el("div", { class: "grid2" });
      f.fields.forEach(sub => g.append(field(sub)));
      body.append(g); continue;
    }
    body.append(field(f));
  }
  function field(f) {
    const w = el("div", { class: "f" });
    w.append(el("label", { for: "f-" + f.key }, f.label));
    let c;
    if (f.type === "textarea") c = el("textarea", { id: "f-" + f.key, rows: f.rows || 6 });
    else if (f.type === "select") {
      c = el("select", { id: "f-" + f.key });
      f.options.forEach(o => c.append(el("option", { value: o[0] }, o[1])));
    } else if (f.type === "color") {
      c = el("div", { class: "swatches" });
      PALETTE.forEach(col => c.append(el("button", {
        type: "button", style: `background:${col}`, class: state[f.key] === col ? "on" : "",
        onclick: e => { state[f.key] = col; [...c.children].forEach(b => b.classList.remove("on")); e.currentTarget.classList.add("on"); }
      })));
      w.append(c); return w;
    } else c = el("input", { id: "f-" + f.key, type: f.type === "number" ? "text" : "text", inputmode: f.type === "number" ? "text" : null, placeholder: f.ph || "" });
    if (c.tagName !== "DIV") c.value = state[f.key] ?? "";
    controls[f.key] = c;
    w.append(c);
    if (f.help) w.append(el("div", { class: "help" }, f.help));
    if (f.after) w.append(f.after(c, state));
    return w;
  }
  if (inline) {
    inline.append(body, el("div", { class: "row iform-acts" }, [extra || null, el("button", { class: "btn prim", onclick: commit }, "Enregistrer")]));
    body.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) commit(); });
    return { close, state, controls };
  }
  const modal = el("div", { class: "modal" }, [
    el("header", {}, [el("h3", {}, title), el("button", { class: "iconbtn", onclick: close, "aria-label": "Fermer" }, "✕")]),
    body,
    el("footer", {}, [
      extra || null,
      el("button", { class: "btn", onclick: close }, "Annuler"),
      el("button", { class: "btn prim", onclick: commit }, "Enregistrer")
    ])
  ]);
  const scrim = el("div", { class: "scrim", onclick: e => { if (e.target === scrim) close(); } }, modal);
  root.append(scrim);
  setTimeout(() => { const first = body.querySelector("input,textarea,select"); first && first.focus(); }, 20);
  function close() { if (inline) return; scrim.remove(); document.removeEventListener("keydown", key, true); }
  function key(e) { if (e.key === "Escape") { e.stopPropagation(); close(); } if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) commit(); }
  document.addEventListener("keydown", key, true);
  function commit() {
    const out = Object.assign({}, state);
    for (const k in controls) out[k] = controls[k].value;
    for (const f of flat(fields)) if (f.type === "number") out[f.key] = parseYear(out[f.key]);
    if (onSave(out) !== false) close();
  }
  function flat(fs) { return fs.flatMap(f => f.type === "row" ? f.fields : [f]); }
  return { close, state, controls };
}
const linksToText = ls => (ls || []).map(l => (l.label ? l.label + " | " : "") + l.url).join("\n");
const textToLinks = t => String(t || "").split("\n").map(s => s.trim()).filter(Boolean).map(s => {
  const i = s.lastIndexOf("|");
  if (i > 0) return { label: s.slice(0, i).trim(), url: s.slice(i + 1).trim() };
  return { label: s.replace(/^https?:\/\/(www\.)?/, "").slice(0, 42), url: s };
});

function wikiField() {
  return (descCtrl, state) => {
    const inp = el("input", { type: "text", placeholder: "https://fr.wikipedia.org/wiki/Empire_romain" });
    const btn = el("button", { class: "btn", type: "button" }, "Importer");
    btn.addEventListener("click", async () => {
      const v = inp.value.trim(); if (!v) return;
      btn.textContent = "…"; btn.disabled = true;
      try {
        const m = v.match(/\/wiki\/([^#?]+)/);
        const t = decodeURIComponent(m ? m[1] : v).replace(/ /g, "_");
        const lang = (v.match(/https?:\/\/(\w{2})\.wikipedia/) || [, "fr"])[1];
        const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`);
        if (!r.ok) throw 0;
        const j = await r.json();
        descCtrl.value = (descCtrl.value ? descCtrl.value + "\n\n" : "") + j.extract;
        const scope = descCtrl.closest(".body") || document;
        const lk = scope.querySelector("#f-linksText");
        const url = j.content_urls?.desktop?.page || v;
        if (lk && !lk.value.includes(url)) lk.value = (lk.value ? lk.value + "\n" : "") + "Wikipédia — " + j.title + " | " + url;
        const im = scope.querySelector("#f-image"), src = wikiThumb(j);
        if (im && !im.value && src) {
          im.value = src;
          const cr = scope.querySelector("#f-imageCredit"); if (cr && !cr.value) cr.value = "Wikimedia Commons, via Wikipédia";
        }
        toast("Résumé importé");
      } catch (e) { toast("Wikipédia injoignable — collez le texte à la main"); }
      btn.textContent = "Importer"; btn.disabled = false;
    });
    return el("div", { class: "wiki", style: "margin-top:6px" }, [inp, btn]);
  };
}

/* Reprendre un contour existant plutôt que tout retracer : celui de la période
   précédente, ou celui d'une autre civilisation dont on hérite du territoire. */
function openTerrCopy(civId, presetId) {
  const c = civ(civId);
  if (!db.territories.some(t => t.rings && t.rings.length)) return setMode("drawTerr", { civId });
  const own = terrOf(civId);
  const preset = presetId ? byId(db.territories, presetId)
    : (own.filter(t => t.start <= year).pop() || own[own.length - 1] || null);
  let srcId = preset ? preset.id : null;

  const body = el("div", { class: "body" });
  const civSel = el("select"), terrSel = el("select");
  const label = el("input", { type: "text", placeholder: "Après les conquêtes de …" });
  const fStart = el("input", { type: "text" }), fEnd = el("input", { type: "text" });

  db.civs.filter(x => db.territories.some(t => t.civId === x.id))
    .sort((a, b) => a.name.localeCompare(b.name, "fr"))
    .forEach(x => civSel.append(el("option", { value: x.id }, x.name)));
  civSel.value = preset ? preset.civId : (civSel.querySelector(`option[value="${civId}"]`) ? civId : civSel.options[0].value);

  function fillTerr() {
    terrSel.textContent = "";
    terrOf(civSel.value).forEach(t => terrSel.append(el("option", { value: t.id }, (t.label || "Sans intitulé") + " · " + fmtSpan(t.start, t.end))));
    if (srcId && terrSel.querySelector(`option[value="${srcId}"]`)) terrSel.value = srcId;
    syncDates();
  }
  function syncDates() {
    const t = byId(db.territories, terrSel.value); if (!t) return;
    fStart.value = String(clamp(t.end + 1, c.start, c.end ?? Y1));
    fEnd.value = String(c.end ?? Y1);
  }
  civSel.addEventListener("change", () => { srcId = null; fillTerr(); });
  terrSel.addEventListener("change", () => { srcId = terrSel.value; syncDates(); });

  const f = (lab, ctrl, help) => el("div", { class: "f" }, [el("label", {}, lab), ctrl, help ? el("div", { class: "help" }, help) : null]);
  body.append(f("Reprendre le tracé de", civSel, "Une autre civilisation si celle-ci hérite de son territoire."));
  body.append(f("Période source", terrSel));
  body.append(f("Intitulé de la nouvelle phase", label));
  body.append(el("div", { class: "grid2" }, [f("Valable à partir de", fStart), f("Jusqu'à", fEnd)]));
  body.append(el("p", { class: "note" }, "Le contour est copié tel quel : vous pourrez ensuite déplacer, ajouter ou retirer ses sommets."));

  const scrim = el("div", { class: "scrim", onclick: e => { if (e.target === scrim) close(); } },
    el("div", { class: "modal" }, [
      el("header", {}, [el("h3", {}, "Reprendre un tracé — " + c.name), el("button", { class: "iconbtn", onclick: () => close() }, "✕")]),
      body,
      el("footer", {}, [
        el("button", { class: "btn", style: "margin-right:auto", onclick: () => { close(); setMode("drawTerr", { civId }); } }, "Tracer à la place"),
        el("button", { class: "btn", onclick: () => close() }, "Annuler"),
        el("button", { class: "btn prim", onclick: commit }, "Reprendre")
      ])
    ]));
  function close() { scrim.remove(); document.removeEventListener("keydown", key, true); }
  function key(e) { if (e.key === "Escape") { e.stopPropagation(); close(); } }
  document.addEventListener("keydown", key, true);
  $("#modalRoot").append(scrim);
  fillTerr();
  setTimeout(() => label.focus(), 20);

  function commit() {
    const src = byId(db.territories, terrSel.value);
    const st = parseYear(fStart.value), en = parseYear(fEnd.value);
    if (!src) return;
    if (st === null || en === null) { toast("Dates incomplètes"); return; }
    let id;
    mutate(() => {
      const o = {
        id: uid("ter"), civId,
        label: label.value.trim() || ("D'après « " + (src.label || "un tracé existant") + " »"),
        start: st, end: Math.max(en, st), rings: JSON.parse(JSON.stringify(src.rings))
      };
      db.territories.push(o); id = o.id;
      sel = { type: "civ", id: civId };
    });
    close();
    setYear(st, true);
    editTerrId = id; editArrow = null;
    fitTo(byId(db.territories, id).rings);
    setMode("editGeom");
    renderAll();
    toast("Tracé repris — ajustez les sommets");
  }
}

const qIn = $("#q"), qRes = $("#qres");
let qIdx = -1, qItems = [];
function runSearch() {
  const v = qIn.value.trim().toLowerCase();
  qRes.textContent = ""; qItems = []; qIdx = -1;
  if (v.length < 2) { qRes.classList.remove("on"); return; }
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const n = norm(v);
  const add = (label, arr, fmt, act) => {
    const hits = arr.filter(o => norm(fmt.text(o)).includes(n)).slice(0, 6);
    if (!hits.length) return;
    qRes.append(el("b", {}, label));
    hits.forEach(o => {
      const b = el("button", { onclick: () => { act(o); qRes.classList.remove("on"); qIn.value = ""; } }, [
        fmt.dot ? el("span", { class: "dot", style: `background:${fmt.dot(o)}` }) : null,
        el("span", {}, fmt.text(o)), el("span", { class: "yr" }, fmt.year(o))
      ]);
      qItems.push(b); qRes.append(b);
    });
  };
  add("Civilisations", db.civs, { text: c => c.name, year: c => fmtSpan(c.start, c.end), dot: c => c.color }, c => select("civ", c.id));
  add("Lieux", db.pois, { text: p => p.name, year: p => (p.civId ? civ(p.civId)?.name : KINDS[p.kind]) || "" }, p => select("poi", p.id, { fit: true }));
  add("Événements", db.events, { text: e => e.title, year: e => fmtYear(e.year, true) }, e => select("event", e.id));
  if (!qItems.length) qRes.append(el("b", {}, "Aucun résultat"));
  qRes.classList.add("on");
}
qIn.addEventListener("input", runSearch);
qIn.addEventListener("focus", () => { if (qIn.value.trim().length > 1) qRes.classList.add("on"); });
qIn.addEventListener("keydown", e => {
  if (e.key === "Escape") { qIn.value = ""; qRes.classList.remove("on"); qIn.blur(); }
  if (!qItems.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    qItems[qIdx]?.classList.remove("cur");
    qIdx = (qIdx + (e.key === "ArrowDown" ? 1 : -1) + qItems.length) % qItems.length;
    qItems[qIdx].classList.add("cur"); qItems[qIdx].scrollIntoView({ block: "nearest" });
  }
  if (e.key === "Enter") { e.preventDefault(); (qItems[qIdx] || qItems[0]).click(); }
});

function helpModal() {
  const root = $("#modalRoot");
  const body = el("div", { class: "body prose" });
  body.innerHTML = md(`## Ce que fait cet atlas
La frise commande la carte : à l'année où se trouve le curseur, la carte affiche les territoires, les villes et les lieux actifs. Cliquez sur un territoire, un lieu ou une bande de la frise pour ouvrir sa fiche.

## Enrichir le contenu
- **+ Civilisation** crée une entrée avec ses dates et sa couleur.
- **+ Territoire** trace une emprise : cliquez les sommets sur la carte, *Entrée* referme le contour, puis indiquez entre quelles dates elle vaut. Un empire qui bouge = plusieurs territoires successifs.
- **+ Lieu** pose une ville, un site ou une bataille.
- Chaque fiche accepte une description (mise en forme simple), des liens, et l'import du résumé d'une page Wikipédia.

## Épisodes, étapes et mouvements
Donnez une date de fin à un événement et il devient un **épisode** : une barre sur la frise plutôt qu'un repère. Sa fiche accepte alors des **étapes** — batailles, sièges, traités — qui se rangent sur une seconde ligne sous lui.

Chaque événement accepte aussi un **lieu** posé sur la carte et des **mouvements** : des flèches tracées au clic, trait plein pour une avancée, discontinu pour un retour. Sélectionner un épisode affiche d'un coup ses étapes et ses flèches, quelle que soit l'année exacte du curseur.

## Reprendre un tracé
Sur la fiche d'une civilisation, *+ Ajouter* un territoire propose d'abord de **repartir d'un contour existant** : celui de la période précédente, ou celui d'une autre civilisation dont celle-ci hérite. Le contour est copié, puis s'ouvre directement en édition de sommets. L'icône de copie en face de chaque territoire fait la même chose à partir de cette période précise.

## Filiations
Une civilisation procède souvent d'une autre. La section *Filiation* relie les deux dans un sens ou dans l'autre, avec un intitulé et, si vous le souhaitez, l'**événement de transition** qui fixe la date du passage. La frise dessine alors un trait entre les deux bandes ; il s'allume quand l'une des deux est sélectionnée, et le clic ouvre l'événement de transition. Le bouton *Filiations*, dans l'en-tête de la frise, masque ces traits.

L'empilement des bandes suit ces liens : une civilisation issue d'une autre **reprend sa ligne, à la suite**, quand la chronologie le permet — la République romaine, l'Empire, l'Occident puis les Carolingiens se lisent ainsi d'un seul trait. Si les deux périodes se chevauchent, l'héritière se place sur la ligne libre la plus proche, ce qui rapproche les branches d'une même souche.

## Tutelles et vassalité
Une civilisation ne disparaît pas toujours quand elle est conquise : elle continue, sous contrôle étranger, puis recouvre parfois son indépendance. La section *Tutelles* enregistre ces périodes dans un sens (⤓ elle subit) ou dans l'autre (⤒ elle domine), avec leur nature — vassalité, province, protectorat, occupation, union dynastique.

Sur la carte, le territoire garde sa propre trame mais reçoit par-dessus, en croisillon, celle de la puissance dominante, un liseré discontinu et une mention en italique. Sur la frise, la bande est barrée des mêmes hachures pendant la seule durée de la tutelle. L'Égypte pharaonique en donne l'exemple : koushite, assyrienne, perse à deux reprises, puis macédonienne, sans jamais quitter la carte.

## Retoucher un tracé
Sur la fiche d'une civilisation — ou en face d'un mouvement, sur la fiche d'un événement — l'icône cible ouvre l'édition des sommets : glissez-les, cliquez un point pâle pour en insérer un, *Alt*+clic pour en retirer un. *+ Partie* ajoute une portion détachée (île, province isolée).

## Raccourcis
- **←** / **→** : reculer ou avancer d'un pas · **Maj** ×10 · **Alt** ×100
- **Échap** : quitter le mode en cours · **Entrée** : fermer le tracé
- **Ctrl/Cmd + Z** : annuler la dernière modification
- **/** : rechercher · molette : zoom (carte et frise)
- **+** / **−** ou double-clic : zoomer la carte (**Maj** + double-clic : dézoomer)
- **P** : panneau latéral · **F** : frise · **C** : carte seule (les deux à la fois)

## Sur téléphone
La carte occupe l'écran ; deux doigts pour zoomer et se déplacer, double-toucher pour zoomer. La fiche s'ouvre en volet depuis le bas : faites glisser sa poignée vers le haut pour l'agrandir, vers le bas pour la réduire puis la fermer. La frise se réduit à un curseur d'années ; la flèche ▴ la déplie. Le bouton *Calques* regroupe noms, lieux, fleuves, relief et grille.

## Disposition
Le panneau latéral et la frise se replient (bouton *Panneau* en haut, flèche à droite de l'en-tête de la frise) et se redimensionnent en glissant leur bord ; un double-clic sur le bord rétablit la taille d'origine. Ces réglages sont conservés dans le navigateur. Sélectionner un élément rouvre le panneau et centre la frise sur sa période.

## Fiche et onglet Technique
Chaque élément s'ouvre sur sa **Description** : image, texte, repères chronologiques, relations, lieux et emprises, sans aucun bouton d'édition. Les comptes autorisés disposent en plus de l'onglet **Technique** : toutes les propriétés y sont modifiables sur place (nom, dates, couleur, texte, liens, image), ainsi que les territoires, tutelles, filiations, événements et lieux rattachés.

L'image est une simple adresse https, de préférence sur Wikimedia Commons ; l'import d'un résumé Wikipédia la remplit lorsqu'il en trouve une.

## Comptes et contributions
Tout le monde consulte l'atlas sans compte. **Créer un compte** (bouton en haut à droite) permet de modifier : vos changements restent alors des **brouillons** dans votre navigateur, signalés par le bouton *Proposer*. Ajoutez une note (vos sources, par exemple) et envoyez : un éditeur relit la proposition, l'examine sur la carte, puis la publie ou la refuse avec un commentaire. L'onglet *Propositions* suit leur sort.

Les **éditeurs** publient directement et valident les propositions depuis l'onglet *Validation*. Les **administrateurs** attribuent les rôles.

## Prudence avec les tracés
Les emprises fournies sont des approximations de lecture. Les frontières anciennes sont souvent des zones d'influence graduées plutôt que des lignes ; corrigez-les selon vos sources.`);

    ]));
  root.append(scrim);
}

document.addEventListener("keydown", e => {
  const typing = /input|textarea|select/i.test(e.target.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); qIn.focus(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); return; }
  if (typing) return;
  if (e.key === "Escape") {
    const scrims = $$(".scrim");
    if (scrims.length) { scrims[scrims.length - 1].remove(); return; }
    if (mode !== "select") setMode("select"); else select(null);
  }
  if (e.key === "Enter" && (mode === "drawTerr" || mode === "drawArrow")) finishDraft();
  if (e.key === "Backspace" && draft && draft.pts.length) { e.preventDefault(); draft.pts.pop(); drawEditLayer(); }
  if (!e.metaKey && !e.ctrlKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "+" || k === "=") { zoomMap(.67); return; }
    if (k === "-" || k === "_") { zoomMap(1.5); return; }
    if (k === "p") { toggleSide(); return; }
    if (k === "f") { toggleTl(); return; }
    if (k === "c") { mapOnly(); return; }
  }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const step = e.altKey ? 100 : e.shiftKey ? 10 : 1;
    setYear(year + (e.key === "ArrowRight" ? step : -step));
  }
});

};
const toggleTl = v => {
  const k = isMobile() ? "tlM" : "tl";
  ui[k] = v === undefined ? !ui[k] : v; applyUi();
};
/* ouverture de la fiche à la sélection */
function revealSheet() {
  if (isMobile()) { if (sheet === "closed") setSheet("half"); }
  else if (!ui.side) { ui.side = true; applyUi(); }
}
function mapOnly() {
  if (isMobile()) { ui.tlM = false; setSheet("closed"); return applyUi(); }
  const only = !ui.side && !ui.tl;
  ui.side = ui.tl = only; applyUi();
}
function dragResize(handle, onMove, onReset) {
  handle.addEventListener("pointerdown", e => {
    e.preventDefault(); handle.setPointerCapture(e.pointerId); document.body.classList.add("resizing");
    const mv = ev => { onMove(ev); setVars(); applyView(); scheduleMap(); if (ui.tl) renderTimeline(); };
    const up = () => { handle.removeEventListener("pointermove", mv); handle.removeEventListener("pointerup", up); document.body.classList.remove("resizing"); applyUi(); };
    handle.addEventListener("pointermove", mv); handle.addEventListener("pointerup", up);
  });
  handle.addEventListener("dblclick", () => { onReset(); applyUi(); });
}
dragResize($("#rzTl"), ev => { ui.tlH = clamp(Math.round(window.innerHeight - ev.clientY), 130, Math.round(window.innerHeight * .7)); }, () => { ui.tlH = UI_DEF.tlH; });
dragResize($("#rzSide"), ev => { ui.sideW = clamp(Math.round(window.innerWidth - ev.clientX), 280, Math.round(window.innerWidth * .55)); }, () => { ui.sideW = UI_DEF.sideW; });

/* zoom de la carte autour d'un point (par défaut le centre de la vue) */
function zoomMap(f, gx, gy) {
  if (gx === undefined) { gx = view.x + view.w / 2; gy = -(view.y + view.h / 2); }
  const nw = clamp(view.w * f, 0.8, 400);
  const rx = (gx - view.x) / view.w, ry = (-gy - view.y) / view.h;
  view.x = gx - rx * nw; view.w = nw;
  view.y = -gy - ry * nw * (map.clientHeight / map.clientWidth);
  applyView(); scheduleMap();
}

/* la frise suit la sélection : période centrée (ou cadrée si elle déborde), bande ramenée au milieu */
function centerTimeline(a, b) {
  if (!tlOn()) return;
  b = b ?? a;
  const span = tview.b - tview.a;
  if (b - a > span * .85) { tlFocus(a, b); }
  else { const m = (a + b) / 2; tview.a = m - span / 2; tview.b = m + span / 2; clampTView(); renderTimeline(); }
}
function scrollToBar(id) {
  if (!tlOn() || !id) return;
  const lanesEl = $("#lanes"), bar = [...laneIn.querySelectorAll(".bar")].find(b => b.dataset.civ === id);
  if (!bar) return;
  lanesEl.scrollTo({ top: Math.max(0, bar.offsetTop - lanesEl.clientHeight / 2 + 10), behavior: "smooth" });
}
function followSelection() {
  if (!sel) return;
  if (sel.type === "event") { const e = byId(db.events, sel.id); if (e) centerTimeline(e.year, evEnd(e)); }
  else if (sel.type === "poi") return;
  else { const c = selCiv(); if (c) { centerTimeline(c.start, c.end ?? Y1); scrollToBar(c.id); } }
}

/* volet mobile : poignée à glisser (haut = plein écran, bas = réduire puis fermer), toucher = basculer */
(function () {
  const grab = $("#sheetGrab");
  let y0 = null, t0 = 0;
  grab.addEventListener("pointerdown", e => { y0 = e.clientY; t0 = Date.now(); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener("pointerup", e => {
    if (y0 === null) return;
    const dy = e.clientY - y0; y0 = null;
    if (Math.abs(dy) < 8 && Date.now() - t0 < 400) return setSheet(sheet === "full" ? "half" : "full");
    if (dy < -40) setSheet("full");
    else if (dy > 40) setSheet(sheet === "full" ? "half" : "closed");
  });
  grab.addEventListener("pointercancel", () => { y0 = null; });
  $("#sheetX").onclick = () => setSheet("closed");
})();

/* pincement à deux doigts sur la carte : zoom autour du centre des doigts, déplacement simultané */
const touches = new Map();
let pinch = null;
function geoAt(v, cx, cy) {
  const r = map.getBoundingClientRect(), k = v.w / r.width;
  return [v.x + (cx - r.left) * k, v.y + (cy - r.top) * k];      // repère SVG (y = -latitude)
}
map.addEventListener("pointerdown", e => {
  if (e.pointerType !== "touch") return;
  touches.set(e.pointerId, [e.clientX, e.clientY]);
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    const c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, g: geoAt(view, c[0], c[1]), w: view.w };
    panEnd(); moved = 1e9;
  }
}, true);
window.addEventListener("pointermove", e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, [e.clientX, e.clientY]);
  if (!pinch || touches.size < 2) return;
  const [a, b] = [...touches.values()], r = map.getBoundingClientRect();
  const d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const nw = clamp(pinch.w * pinch.d / d, 0.8, 400), k = nw / r.width;
  view.w = nw; view.x = pinch.g[0] - (c[0] - r.left) * k; view.y = pinch.g[1] - (c[1] - r.top) * k;
  applyView(); scheduleMap();
});
const endTouch = e => { touches.delete(e.pointerId); if (touches.size < 2) pinch = null; };
window.addEventListener("pointerup", endTouch);
window.addEventListener("pointercancel", endTouch);

/* =====================  BRANCHEMENTS  ===================== */
$("#tSelect").onclick = () => setMode("select");
$("#tTerr").onclick = () => {
  if (!db.civs.length) return toast("Créez d'abord une civilisation");
  if (!selCiv()) return toast("Sélectionnez la civilisation concernée");
  setMode(mode === "drawTerr" ? "select" : "drawTerr");
};
$("#tPoi").onclick = () => setMode(mode === "placePoi" ? "select" : "placePoi");
$("#tLabels").onclick = e => { show.labels = !show.labels; e.currentTarget.classList.toggle("on", show.labels); renderMap(); };
$("#tPois").onclick = e => { show.pois = !show.pois; e.currentTarget.classList.toggle("on", show.pois); renderMap(); };
$("#tRiv").onclick = e => { show.rivers = !show.rivers; e.currentTarget.classList.toggle("on", show.rivers); drawRivers(); };
$("#tRel").onclick = e => { show.relief = !show.relief; e.currentTarget.classList.toggle("on", show.relief); drawRelief(); };
$("#tGrid").onclick = e => { show.grid = !show.grid; e.currentTarget.classList.toggle("on", show.grid); drawGrid(); };
$("#tFit").onclick = fitWorld;
$("#btnNewCiv").onclick = () => openCivForm();
$("#btnHelp").onclick = helpModal;
$("#btnSide").onclick = () => toggleSide();
$("#tlToggle").onclick = () => toggleTl();
$("#zIn").onclick = () => zoomMap(.67);
$("#zOut").onclick = () => zoomMap(1.5);
$("#zFull").onclick = mapOnly;
$("#tLayers").onclick = () => document.body.classList.toggle("layers-open");
$("#yearRange").addEventListener("input", e => setYear(+e.target.value));
$("#btnAccount").onclick = () => (user ? openAccount() : openAuth("login"));
$("#btnPropose").onclick = openPropose;
$("#yBack").onclick = () => setYear(year - 25);
$("#yFwd").onclick = () => setYear(year + 25);
$("#tlLinks").onclick = e => { showLinks = !showLinks; e.currentTarget.classList.toggle("on", showLinks); renderTimeline(); };
$("#tlZoomIn").onclick = () => tlZoom(.6);
$("#tlZoomOut").onclick = () => tlZoom(1.7);
$("#tlAll").onclick = () => { tview = { a: Y0, b: Y1 }; renderTimeline(); };
$("#tlFilter").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tlFilter = b.dataset.f;
  $$("#tlFilter button").forEach(x => x.classList.toggle("on", x === b));
  renderTimeline();
});
$$(".tabs button").forEach(b => b.onclick = () => { if (b.dataset.tab === "props") propDetail = null; tab = b.dataset.tab; renderPanel(); });

function renderAll() { renderMap(); renderTimeline(); renderPanel(); }

/* =====================  DÉMARRAGE  ===================== */
(async function init() {
  setSaveState("chargement…");
  applyUi(false);
  if (isMobile()) fitWorld();
  if (CFG.supabaseUrl && CFG.supabaseAnonKey) {
    backend = "supabase";
    if (window.supabase && window.supabase.createClient)
      SB = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, detectSessionInUrl: true } });
    else console.error("supabase-js non chargé");
  }
  drawGrid(); applyView(); loadGeo(); loadRelief();
  await loadPublished();
  if (backend === "supabase" && !SB) remoteState = "down";
  if (backend === "file") {
    role = "local";
    applyDraft();
    pendingOps = diffDb(base, db).length;
    setSaveState(pendingOps ? `${pendingOps} modif. en attente` : "fichier");
  } else if (SB) {
    setSaveState(remoteState === "ok" ? "à jour" : "lecture seule");
    try { await initAuth(); } catch (e) { console.error(e); }
  } else setSaveState("lecture seule");
  setYear(year, true);
  updateChrome(); renderAll();
  if (backend === "file" && pendingOps) setTimeout(() => toast(`${pendingOps} modification${pendingOps > 1 ? "s" : ""} locale${pendingOps > 1 ? "s" : ""} retrouvée${pendingOps > 1 ? "s" : ""}`), 400);
})();
</script>
